<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史 - 驯墨</title>
    <style id="theme-vars">
/* ============================================================
   驯墨 Tame Ink — 品牌设计令牌 · 夜墨主题 v2
   ============================================================
   核心理念：作者只做三件事——说想法、看结果、做取舍
   暗色沉浸主题，单栏聚焦布局
   ============================================================ */

:root {
  /* === 品牌主色 — 墨绿 === */
  --brand: #6aae8d;
  --brand-hover: #5d9a7d;
  --brand-active: #4c8a6a;
  --brand-muted: rgba(106, 174, 141, 0.12);
  --brand-muted-hover: rgba(106, 174, 141, 0.2);
  --brand-subtle: rgba(106, 174, 141, 0.06);
  --brand-foreground: #ffffff;

  /* === 表面色阶 === */
  --surface-0: #0d1117;
  --surface-1: #151c25;
  --surface-2: #1a2332;
  --surface-3: #222f40;
  --surface-4: #2d3d52;

  /* === 文本色阶 === */
  --text-primary: #e6edf3;
  --text-secondary: #a3b8cc;
  --text-tertiary: #7a92ab;
  --text-muted: #546a84;
  --text-on-brand: #ffffff;

  /* === 边框 === */
  --border-default: rgba(148, 163, 184, 0.12);
  --border-strong: rgba(148, 163, 184, 0.22);
  --border-brand: rgba(106, 174, 141, 0.35);

  /* === 状态色 === */
  --state-success: #4ade80;
  --state-success-bg: rgba(74, 222, 128, 0.1);
  --state-warning: #fbbf24;
  --state-warning-bg: rgba(251, 191, 36, 0.1);
  --state-error: #f87171;
  --state-error-bg: rgba(248, 113, 113, 0.1);
  --state-info: #60a5fa;
  --state-info-bg: rgba(96, 165, 250, 0.1);

  /* === 语义别名 === */
  --background: var(--surface-0);
  --foreground: var(--text-primary);
  --color-background: var(--surface-0);
  --color-foreground: var(--text-primary);
  --color-card: var(--surface-2);
  --color-card-foreground: var(--text-primary);
  --color-popover: var(--surface-3);
  --color-popover-foreground: var(--text-primary);
  --color-primary: var(--brand);
  --color-primary-foreground: var(--brand-foreground);
  --color-muted: var(--surface-3);
  --color-muted-foreground: var(--text-secondary);
  --color-border: var(--border-default);
  --color-input: var(--border-default);
  --color-ring: var(--brand);

  /* === 圆角 === */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === 字体 === */
  --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-serif: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  --font-mono: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, monospace;

  /* === 字号 === */
  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 22px;
  --text-3xl: 28px;
  --text-4xl: 36px;

  /* === 间距 === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === 布局 === */
  --sidebar-width: 200px;
  --topbar-height: 48px;
  --content-max-width: 760px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100vh;
  color: var(--text-primary);
  background: var(--surface-0);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-serif); font-weight: 700; line-height: 1.25; }
a { color: var(--brand); text-decoration: none; transition: color 0.15s; }
a:hover { color: var(--brand-hover); }
button { color: inherit; font: inherit; cursor: pointer; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 9999px; }
::selection { background: var(--brand-muted); color: var(--brand-foreground); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">

    --color-popover: var(--color-popover);
    --color-popover-foreground: var(--color-popover-foreground);

    --color-primary-foreground: var(--color-primary-foreground);
    --color-muted: var(--color-muted);

    </style>
    <style id="semantic-token-fallback">

      .text-background { color: var(--background); }

      .text-card-foreground { color: var(--color-card-foreground); }
      .border-card-foreground { border-color: var(--color-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--color-card-foreground); }

      .text-popover { color: var(--color-popover); }

      .bg-popover-foreground { background-color: var(--color-popover-foreground); }

      .border-popover-foreground { border-color: var(--color-popover-foreground); }

      .bg-primary { background-color: var(--color-primary); }
      .text-primary { color: var(--color-primary); }
      .border-primary { border-color: var(--color-primary); }
      .ring-primary { --tw-ring-color: var(--color-primary); }
      .bg-primary-foreground { background-color: var(--color-primary-foreground); }
      .text-primary-foreground { color: var(--color-primary-foreground); }
      .border-primary-foreground { border-color: var(--color-primary-foreground); }

      .border-muted { border-color: var(--color-muted); }

      .bg-input { background-color: var(--color-input); }

    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>

    <!-- ============================================================
         共享项目外壳样式（来自 partials/project-shell.html）
         ============================================================ -->
    <style>
      /* === 应用外壳整体布局 === */
      .app-shell {
        display: grid;
        grid-template-rows: var(--topbar-height) 1fr;
        grid-template-columns: var(--sidebar-width) 1fr;
        height: 100vh;
        overflow: hidden;
      }

      /* === 顶栏 === */
      .topbar {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: var(--topbar-height);
        padding: 0 var(--space-5);
        background: var(--surface-1);
        border-bottom: 1px solid var(--border-default);
      }

      /* 品牌标识区 */
      .brand {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .brand-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        background: var(--brand);
        color: var(--brand-foreground);
        border-radius: var(--radius-sm);
        font-family: var(--font-serif);
        font-size: var(--text-sm);
        font-weight: 700;
        line-height: 1;
      }
      .brand-name {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }
      .brand-name .name-main {
        font-family: var(--font-serif);
        font-size: var(--text-base);
        font-weight: 700;
        color: var(--text-primary);
      }
      .brand-name .name-sub {
        font-size: var(--text-xs);
        color: var(--text-muted);
        letter-spacing: 0.5px;
      }

      /* 顶栏右侧 */
      .topbar-right {
        display: flex;
        align-items: center;
        gap: var(--space-4);
      }
      .connection-status {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        font-size: var(--text-sm);
        color: var(--text-secondary);
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--state-success);
        box-shadow: 0 0 0 3px var(--state-success-bg);
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        color: var(--text-tertiary);
        transition: background 0.15s, color 0.15s;
      }
      .icon-btn:hover {
        background: var(--surface-2);
        color: var(--text-secondary);
      }
      .icon-btn i { width: 16px; height: 16px; }

      /* === 侧边栏 === */
      .sidebar {
        background: var(--surface-1);
        border-right: 1px solid var(--border-default);
        padding: var(--space-4) var(--space-3);
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        overflow-y: auto;
      }

      /* 新建故事按钮 */
      .new-story-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        width: 100%;
        height: 36px;
        background: var(--brand-muted);
        color: var(--brand);
        border: 1px solid var(--border-brand);
        border-radius: var(--radius-sm);
        font-size: var(--text-sm);
        font-weight: 600;
        transition: background 0.15s, color 0.15s;
      }
      .new-story-btn:hover {
        background: var(--brand-muted-hover);
        color: var(--brand-hover);
      }
      .new-story-btn i { width: 16px; height: 16px; }

      /* 侧边栏导航分隔 */
      .sidebar-divider {
        height: 1px;
        background: var(--border-default);
        margin: var(--space-1) 0;
      }

      /* 导航项 */
      .nav-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 36px;
        padding: 0 var(--space-3);
        background: transparent;
        border: none;
        border-left: 3px solid transparent;
        border-radius: var(--radius-sm);
        color: var(--text-tertiary);
        font-size: var(--text-sm);
        text-align: left;
        transition: background 0.15s, color 0.15s;
      }
      .nav-item i { width: 16px; height: 16px; flex-shrink: 0; }
      .nav-item:hover {
        color: var(--text-secondary);
        background: var(--surface-2);
      }
      /* 激活态 */
      .nav-item[data-active="true"] {
        color: var(--brand);
        background: var(--brand-subtle);
        border-left: 3px solid var(--brand);
        font-weight: 600;
      }

      /* === 主内容区 === */
      .main-content {
        height: 100%;
        overflow-y: auto;
        background: var(--surface-0);
      }

      /* === 单栏聚焦容器 === */
      .focus-container {
        max-width: var(--content-max-width);
        margin: 0 auto;
        padding: var(--space-8) var(--space-6);
      }
    </style>

    <!-- ============================================================
         历史抽屉页面专属样式
         ============================================================ -->
    <style>
      /* main-content 设为相对定位，承载抽屉遮罩层 */
      .main-content { position: relative; }

      /* === 抽屉遮罩层：覆盖工作台主内容区 === */
      .drawer-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 50;
      }

      /* === 历史抽屉（右侧滑出，展开态） === */
      .history-drawer {
        position: fixed;
        top: 0;
        right: 0;
        height: 100vh;
        width: 340px;
        background: var(--surface-2);
        border-left: 1px solid var(--border-strong);
        z-index: 100;
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.2);
        transform: translateX(0);
        display: flex;
        flex-direction: column;
      }

      /* 抽屉头部 */
      .drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-4) var(--space-5);
        border-bottom: 1px solid var(--border-default);
        flex-shrink: 0;
      }
      .drawer-title {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        font-family: var(--font-serif);
        font-size: var(--text-lg);
        font-weight: 700;
        color: var(--text-primary);
      }
      .drawer-title i { width: 18px; height: 18px; color: var(--brand); }
      /* 关闭按钮 hover 态使用更深的 surface-3 */
      .drawer-close:hover {
        background: var(--surface-3);
      }

      /* === 时间线列表 === */
      .timeline-list {
        flex: 1;
        overflow-y: auto;
        padding: var(--space-4);
      }
      /* 竖向时间线：左侧竖线 + 内容缩进 */
      .timeline {
        border-left: 1px solid var(--border-default);
        padding-left: var(--space-4);
        display: flex;
        flex-direction: column;
      }
      .timeline-item {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
        padding: var(--space-3) 0;
      }
      /* 时间线节点：8px 圆点，绝对定位在竖线上（品牌色=已完成） */
      .timeline-dot {
        position: absolute;
        left: calc(-1 * var(--space-4) - 4px);
        top: calc(var(--space-3) + 2px);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--brand);
      }
      .timeline-time {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
      }
      .timeline-action {
        font-size: var(--text-sm);
        color: var(--text-primary);
        font-weight: 500;
      }

      /* 结果标签 */
      .result-tag {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        padding: 2px var(--space-2);
        border-radius: var(--radius-sm);
        font-size: var(--text-xs);
        font-weight: 500;
        margin-top: var(--space-1);
      }
      .result-adopted {
        background: var(--state-success-bg);
        color: var(--state-success);
      }
      .result-modified {
        background: var(--state-info-bg);
        color: var(--state-info);
      }
      .result-regenerated {
        background: var(--state-warning-bg);
        color: var(--state-warning);
      }

      /* 抽屉底部 */
      .drawer-footer {
        padding: var(--space-4);
        border-top: 1px solid var(--border-default);
        text-align: center;
        flex-shrink: 0;
      }
      .view-log-btn {
        background: transparent;
        border: none;
        color: var(--brand);
        font-size: var(--text-sm);
        font-weight: 500;
        transition: color 0.15s;
      }
      .view-log-btn:hover {
        color: var(--brand-hover);
      }

      /* === 工作台背景内容（被遮罩变暗） === */
      .workspace-header {
        margin-bottom: var(--space-6);
      }
      .workspace-header h1 {
        font-size: var(--text-2xl);
        color: var(--text-primary);
      }
      .workspace-subtitle {
        margin-top: var(--space-1);
        font-size: var(--text-sm);
        color: var(--text-tertiary);
      }
      .workspace-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: var(--space-4);
      }
      .ws-card {
        background: var(--surface-2);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        padding: var(--space-4);
      }
      .ws-card-head {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        font-family: var(--font-serif);
        font-size: var(--text-base);
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: var(--space-2);
      }
      .ws-card-head i { width: 16px; height: 16px; color: var(--brand); }
      .ws-card-desc {
        font-size: var(--text-sm);
        color: var(--text-secondary);
        line-height: 1.5;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">

  <div class="app-shell">

    <!-- ===== 顶栏 ===== -->
    <header class="topbar">
      <!-- 左侧：品牌标识 -->
      <div class="brand">
        <div class="brand-mark">墨</div>
        <div class="brand-name">
          <span class="name-main">驯墨</span>
          <span class="name-sub">Tame Ink</span>
        </div>
      </div>
      <!-- 右侧：连接状态 + 历史 -->
      <div class="topbar-right">
        <div class="connection-status">
          <span class="status-dot"></span>
          <span>已连接</span>
        </div>
        <button class="icon-btn" data-dom-id="open-history" aria-label="历史记录">
          <i data-lucide="history"></i>
        </button>
      </div>
    </header>

    <!-- ===== 侧边栏 ===== -->
    <aside class="sidebar">
      <!-- 新建故事按钮 -->
      <button class="new-story-btn" type="button">
        <i data-lucide="plus"></i>
        <span>新建故事</span>
      </button>

      <div class="sidebar-divider"></div>

      <!-- 导航项（工作台为激活态） -->
      <nav class="nav-list">
        <button class="nav-item" type="button" data-nav-key="workspace" data-active="true">
          <i data-lucide="layout-dashboard"></i>
          <span>工作台</span>
        </button>
        <button class="nav-item" type="button" data-nav-key="library">
          <i data-lucide="book-open"></i>
          <span>故事库</span>
        </button>
        <button class="nav-item" type="button" data-nav-key="settings">
          <i data-lucide="settings"></i>
          <span>设置</span>
        </button>
      </nav>
    </aside>

    <!-- ===== 主内容区（工作台，被遮罩变暗） ===== -->
    <main class="main-content">
      <!-- 工作台背景内容 -->
      <div class="focus-container">
        <div class="workspace-header">
          <h1>工作台</h1>
          <p class="workspace-subtitle">当前故事 · 暮色之诗</p>
