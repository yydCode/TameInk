    <style id="theme-vars">
/* ============================================================
   驯墨 Tame Ink — 品牌设计令牌 · 夜墨主题 v2
   ============================================================
   核心理念：作者只做三件事——说想法、看结果、做取舍
   暗色沉浸主题，单栏聚焦布局
   ============================================================ */

:root {
  /* === 品牌主色 — 墨绿 === */
  --brand: #6aae8d;
  --brand-hover: #5d9a7d;
  --brand-active: #4c8a6a;
  --brand-muted: rgba(106, 174, 141, 0.12);
  --brand-muted-hover: rgba(106, 174, 141, 0.2);
  --brand-subtle: rgba(106, 174, 141, 0.06);
  --brand-foreground: #ffffff;

  /* === 表面色阶 === */
  --surface-0: #0d1117;
  --surface-1: #151c25;
  --surface-2: #1a2332;
  --surface-3: #222f40;
  --surface-4: #2d3d52;

  /* === 文本色阶 === */
  --text-primary: #e6edf3;
  --text-secondary: #a3b8cc;
  --text-tertiary: #7a92ab;
  --text-muted: #546a84;
  --text-on-brand: #ffffff;

  /* === 边框 === */
  --border-default: rgba(148, 163, 184, 0.12);
  --border-strong: rgba(148, 163, 184, 0.22);
  --border-brand: rgba(106, 174, 141, 0.35);

  /* === 状态色 === */
  --state-success: #4ade80;
  --state-success-bg: rgba(74, 222, 128, 0.1);
  --state-warning: #fbbf24;
  --state-warning-bg: rgba(251, 191, 36, 0.1);
  --state-error: #f87171;
  --state-error-bg: rgba(248, 113, 113, 0.1);
  --state-info: #60a5fa;
  --state-info-bg: rgba(96, 165, 250, 0.1);

  /* === 语义别名 === */
  --background: var(--surface-0);
  --foreground: var(--text-primary);
  --color-background: var(--surface-0);
  --color-foreground: var(--text-primary);
  --color-card: var(--surface-2);
  --color-card-foreground: var(--text-primary);
  --color-popover: var(--surface-3);
  --color-popover-foreground: var(--text-primary);
  --color-primary: var(--brand);
  --color-primary-foreground: var(--brand-foreground);
  --color-muted: var(--surface-3);
  --color-muted-foreground: var(--text-secondary);
  --color-border: var(--border-default);
  --color-input: var(--border-default);
  --color-ring: var(--brand);

  /* === 圆角 === */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === 字体 === */
  --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-serif: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  --font-mono: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, monospace;

  /* === 字号 === */
  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 22px;
  --text-3xl: 28px;
  --text-4xl: 36px;

  /* === 间距 === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === 布局 === */
  --sidebar-width: 200px;
  --topbar-height: 48px;
  --content-max-width: 760px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100vh;
  color: var(--text-primary);
  background: var(--surface-0);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-serif); font-weight: 700; line-height: 1.25; }
a { color: var(--brand); text-decoration: none; transition: color 0.15s; }
a:hover { color: var(--brand-hover); }
button { color: inherit; font: inherit; cursor: pointer; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 9999px; }
::selection { background: var(--brand-muted); color: var(--brand-foreground); }

    <!-- ============================================================
         外壳 CSS（来自 project-shell.html）
         ============================================================ -->
    <style>
  /* === 应用外壳整体布局 === */
  .app-shell {
    display: grid;
    grid-template-rows: var(--topbar-height) 1fr;
    grid-template-columns: var(--sidebar-width) 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* === 顶栏 === */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--topbar-height);
    padding: 0 var(--space-5);
    background: var(--surface-1);
    border-bottom: 1px solid var(--border-default);
  }

  /* 品牌标识区 */
  .brand {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .brand-mark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: var(--brand);
    color: var(--brand-foreground);
    border-radius: var(--radius-sm);
    font-family: var(--font-serif);
    font-size: var(--text-sm);
    font-weight: 700;
    line-height: 1;
  }
  .brand-name {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }
  .brand-name .name-main {
    font-family: var(--font-serif);
    font-size: var(--text-base);
    font-weight: 700;
    color: var(--text-primary);
  }
  .brand-name .name-sub {
    font-size: var(--text-xs);
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  /* 顶栏右侧 */
  .topbar-right {
    display: flex;
    align-items: center;
    gap: var(--space-4);
  }
  .connection-status {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: var(--text-sm);
    color: var(--text-secondary);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--state-success);
    box-shadow: 0 0 0 3px var(--state-success-bg);
  }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--text-tertiary);
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover {
    background: var(--surface-2);
    color: var(--text-secondary);
  }
  .icon-btn i { width: 16px; height: 16px; }

  /* === 侧边栏 === */
  .sidebar {
    background: var(--surface-1);
    border-right: 1px solid var(--border-default);
    padding: var(--space-4) var(--space-3);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    overflow-y: auto;
  }

  /* 新建故事按钮 */
  .new-story-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    width: 100%;
    height: 36px;
    background: var(--brand-muted);
    color: var(--brand);
    border: 1px solid var(--border-brand);
    border-radius: var(--radius-sm);
    font-size: var(--text-sm);
    font-weight: 600;
    transition: background 0.15s, color 0.15s;
  }
  .new-story-btn:hover {
    background: var(--brand-muted-hover);
    color: var(--brand-hover);
  }
  .new-story-btn i { width: 16px; height: 16px; }

  /* 侧边栏导航分隔 */
  .sidebar-divider {
    height: 1px;
    background: var(--border-default);
    margin: var(--space-1) 0;
  }

  /* 导航项 */
  .nav-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 36px;
    padding: 0 var(--space-3);
    background: transparent;
    border: none;
    border-left: 3px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text-tertiary);
    font-size: var(--text-sm);
    text-align: left;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item i { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-item:hover {
    color: var(--text-secondary);
    background: var(--surface-2);
  }
  /* 激活态 */
  .nav-item[data-active="true"] {
    color: var(--brand);
    background: var(--brand-subtle);
    border-left: 3px solid var(--brand);
    font-weight: 600;
  }

  /* === 主内容区 === */
  .main-content {
    height: 100%;
    overflow-y: auto;
    background: var(--surface-0);
  }

  /* === 单栏聚焦容器 === */
  .focus-container {
    max-width: var(--content-max-width);
    margin: 0 auto;
    padding: var(--space-8) var(--space-6);
  }
    </style>

    <!-- ============================================================
         页面特有 CSS — 词汇检测结果
         ============================================================ -->
    <style>
  /* === 词汇检测卡片（同工作台卡片基底） === */
  .vocab-card {
    background: var(--surface-1);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-xl);
    overflow: hidden;
  }

  /* 标题条：serif / text-lg / bold + 底部分隔线 */
  .vocab-card-header {
    padding: var(--space-4) var(--space-8);
    font-family: var(--font-serif);
    font-size: var(--text-lg);
    font-weight: 700;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border-default);
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .vocab-card-header i {
    width: 18px;
    height: 18px;
    color: var(--text-tertiary);
  }

  /* 警告条 */
  .vocab-warn-bar {
    background: var(--state-warning-bg);
    border-left: 3px solid var(--state-warning);
    border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-4);
    margin: var(--space-4) var(--space-8);
    display: flex;
    align-items: center;
    gap: var(--space-2);
    flex-wrap: wrap;
  }
  .vocab-warn-bar i {
    width: 14px;
    height: 14px;
    color: var(--state-warning);
    flex-shrink: 0;
  }
  .vocab-warn-bar .warn-text {
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--state-warning);
  }
  .vocab-warn-bar .warn-hint {
    font-size: var(--text-xs);
    color: var(--text-tertiary);
  }

  /* 问题列表 */
  .vocab-problem-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    padding: 0 var(--space-8) var(--space-4);
  }

  /* 问题项：可点击定位到段落 */
  .vocab-problem-item {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s;
  }
  .vocab-problem-item:hover {
    background: var(--surface-3);
  }
  .vocab-problem-item .dot {
    color: var(--text-tertiary);
    font-weight: 700;
  }
  .vocab-problem-item .word {
    font-family: var(--font-mono);
    font-size: var(--text-base);
    color: var(--text-primary);
  }
  .vocab-problem-item .count {
    font-size: var(--text-sm);
    color: var(--text-secondary);
  }

  /* 类型标签 */
  .vocab-tag {
    margin-left: auto;
    font-size: var(--text-xs);
    border-radius: var(--radius-full);
    padding: 1px 8px;
    white-space: nowrap;
  }
  .vocab-tag-warning {
    background: var(--state-warning-bg);
    color: var(--state-warning);
  }
  .vocab-tag-error {
    background: var(--state-error-bg);
    color: var(--state-error);
  }

  /* 底部操作区 */
  .vocab-card-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-4) var(--space-8);
    border-top: 1px solid var(--border-default);
  }
  .vocab-text-btn {
    font-size: var(--text-sm);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: var(--space-1) var(--space-2);
    border-radius: var(--radius-sm);
    transition: color 0.15s, background 0.15s;
  }
  .vocab-text-btn-brand {
    color: var(--brand);
  }
  .vocab-text-btn-brand:hover {
    color: var(--brand-hover);
    background: var(--brand-subtle);
  }
  .vocab-text-btn-muted {
    color: var(--text-tertiary);
  }
  .vocab-text-btn-muted:hover {
    color: var(--text-secondary);
  }
    </style>

<div class="app-shell">

  <!-- ===== 顶栏 ===== -->
  <header class="topbar">
    <!-- 左侧：品牌标识 -->
    <div class="brand">
      <div class="brand-mark">墨</div>
      <div class="brand-name">
        <span class="name-main">驯墨</span>
        <span class="name-sub">Tame Ink</span>
      </div>
    </div>

    <!-- 右侧：连接状态 + 历史 -->
    <div class="topbar-right">
      <div class="connection-status">
        <span class="status-dot"></span>
        <span>已连接</span>
      </div>
      <button class="icon-btn" data-dom-id="open-history" aria-label="历史记录">
        <i data-lucide="history"></i>
      </button>
    </div>
  </header>

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <!-- 新建故事按钮 -->
    <button class="new-story-btn" type="button">
      <i data-lucide="plus"></i>
      <span>新建故事</span>
    </button>

    <div class="sidebar-divider"></div>

    <!-- 导航项（工作台设为激活态） -->
    <nav class="nav-list">
      <button class="nav-item" type="button" data-nav-key="workspace" data-active="true">
        <i data-lucide="layout-dashboard"></i>
        <span>工作台</span>
      </button>
      <button class="nav-item" type="button" data-nav-key="library">
        <i data-lucide="book-open"></i>
        <span>故事库</span>
      </button>
      <button class="nav-item" type="button" data-nav-key="settings">
        <i data-lucide="settings"></i>
        <span>设置</span>
      </button>
    </nav>
  </aside>

  <!-- ===== 主内容区 ===== -->
  <main class="main-content">
    <!-- 单栏聚焦容器 -->
    <div class="focus-container">

      <!-- 词汇检测结果卡片 -->
      <section class="vocab-card" data-dom-id="vocab-check-card">

        <!-- 标题条 -->
        <div class="vocab-card-header">
          <i data-lucide="scan-text"></i>
          <span>词汇检测</span>
        </div>

        <!-- 警告条 -->
        <div class="vocab-warn-bar">
          <i data-lucide="triangle-alert"></i>
          <span class="warn-text">检测到 3 个问题</span>
          <span class="warn-hint">（点击定位到段落）</span>
        </div>

        <!-- 问题列表 -->
        <div class="vocab-problem-list">
          <!-- 问题项 1 -->
          <button class="vocab-problem-item" type="button" data-dom-id="locate-vocab-0">
            <span class="dot">·</span>
            <span class="word">"心头一震"</span>
            <span class="count">出现 4 次</span>
            <span class="vocab-tag vocab-tag-warning">AI 套话</span>
          </button>
          <!-- 问题项 2 -->
          <button class="vocab-problem-item" type="button" data-dom-id="locate-vocab-1">
            <span class="dot">·</span>
            <span class="word">"不由得"</span>
            <span class="count">出现 3 次</span>
            <span class="vocab-tag vocab-tag-warning">AI 套话</span>
          </button>
          <!-- 问题项 3 -->
          <button class="vocab-problem-item" type="button" data-dom-id="locate-vocab-2">
            <span class="dot">·</span>
            <span class="word">"缓缓"</span>
            <span class="count">每千字 5.2 次</span>
            <span class="vocab-tag vocab-tag-error">重复过频</span>
          </button>
        </div>

        <!-- 底部操作区 -->
        <div class="vocab-card-footer">
          <button class="vocab-text-btn vocab-text-btn-muted" type="button" data-dom-id="vocab-ignore">忽略</button>
          <button class="vocab-text-btn vocab-text-btn-brand" type="button" data-dom-id="vocab-replace-all">全部替换为 AI 建议</button>
        </div>

      </section>

    </div>
  </main>

</div>

<script>lucide.createIcons();</script>
</body>
</html>
