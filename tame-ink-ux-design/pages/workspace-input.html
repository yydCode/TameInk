    <style id="theme-vars">
/* ============================================================
   驯墨 Tame Ink — 品牌设计令牌 · 夜墨主题 v2
   ============================================================
   核心理念：作者只做三件事——说想法、看结果、做取舍
   暗色沉浸主题，单栏聚焦布局
   ============================================================ */

:root {
  /* === 品牌主色 — 墨绿 === */
  --brand: #6aae8d;
  --brand-hover: #5d9a7d;
  --brand-active: #4c8a6a;
  --brand-muted: rgba(106, 174, 141, 0.12);
  --brand-muted-hover: rgba(106, 174, 141, 0.2);
  --brand-subtle: rgba(106, 174, 141, 0.06);
  --brand-foreground: #ffffff;

  /* === 表面色阶 === */
  --surface-0: #0d1117;
  --surface-1: #151c25;
  --surface-2: #1a2332;
  --surface-3: #222f40;
  --surface-4: #2d3d52;

  /* === 文本色阶 === */
  --text-primary: #e6edf3;
  --text-secondary: #a3b8cc;
  --text-tertiary: #7a92ab;
  --text-muted: #546a84;
  --text-on-brand: #ffffff;

  /* === 边框 === */
  --border-default: rgba(148, 163, 184, 0.12);
  --border-strong: rgba(148, 163, 184, 0.22);
  --border-brand: rgba(106, 174, 141, 0.35);

  /* === 状态色 === */
  --state-success: #4ade80;
  --state-success-bg: rgba(74, 222, 128, 0.1);
  --state-warning: #fbbf24;
  --state-warning-bg: rgba(251, 191, 36, 0.1);
  --state-error: #f87171;
  --state-error-bg: rgba(248, 113, 113, 0.1);
  --state-info: #60a5fa;
  --state-info-bg: rgba(96, 165, 250, 0.1);

  /* === 语义别名 === */
  --background: var(--surface-0);
  --foreground: var(--text-primary);
  --color-background: var(--surface-0);
  --color-foreground: var(--text-primary);
  --color-card: var(--surface-2);
  --color-card-foreground: var(--text-primary);
  --color-popover: var(--surface-3);
  --color-popover-foreground: var(--text-primary);
  --color-primary: var(--brand);
  --color-primary-foreground: var(--brand-foreground);
  --color-muted: var(--surface-3);
  --color-muted-foreground: var(--text-secondary);
  --color-border: var(--border-default);
  --color-input: var(--border-default);
  --color-ring: var(--brand);

  /* === 圆角 === */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === 字体 === */
  --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-serif: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  --font-mono: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, monospace;

  /* === 字号 === */
  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 22px;
  --text-3xl: 28px;
  --text-4xl: 36px;

  /* === 间距 === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === 布局 === */
  --sidebar-width: 200px;
  --topbar-height: 48px;
  --content-max-width: 760px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100vh;
  color: var(--text-primary);
  background: var(--surface-0);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-serif); font-weight: 700; line-height: 1.25; }
a { color: var(--brand); text-decoration: none; transition: color 0.15s; }
a:hover { color: var(--brand-hover); }
button { color: inherit; font: inherit; cursor: pointer; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 9999px; }
::selection { background: var(--brand-muted); color: var(--brand-foreground); }

    </style>

    --color-popover-foreground: var(--color-popover-foreground);

  }

    <!-- ============================================================
         外壳 CSS（来自 project-shell.html）
         ============================================================ -->
    <style>
  /* === 应用外壳整体布局 === */
  .app-shell {
    display: grid;
    grid-template-rows: var(--topbar-height) 1fr;
    grid-template-columns: var(--sidebar-width) 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* === 顶栏 === */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--topbar-height);
    padding: 0 var(--space-5);
    background: var(--surface-1);
    border-bottom: 1px solid var(--border-default);
  }

  /* 品牌标识区 */
  .brand {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .brand-mark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: var(--brand);
    color: var(--brand-foreground);
    border-radius: var(--radius-sm);
    font-family: var(--font-serif);
    font-size: var(--text-sm);
    font-weight: 700;
    line-height: 1;
  }
  .brand-name {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }
  .brand-name .name-main {
    font-family: var(--font-serif);
    font-size: var(--text-base);
    font-weight: 700;
    color: var(--text-primary);
  }
  .brand-name .name-sub {
    font-size: var(--text-xs);
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  /* 顶栏右侧 */
  .topbar-right {
    display: flex;
    align-items: center;
    gap: var(--space-4);
  }
  .connection-status {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: var(--text-sm);
    color: var(--text-secondary);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--state-success);
    box-shadow: 0 0 0 3px var(--state-success-bg);
  }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--text-tertiary);
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover {
    background: var(--surface-2);
    color: var(--text-secondary);
  }
  .icon-btn i { width: 16px; height: 16px; }

  /* === 侧边栏 === */
  .sidebar {
    background: var(--surface-1);
    border-right: 1px solid var(--border-default);
    padding: var(--space-4) var(--space-3);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    overflow-y: auto;
  }

  /* 新建故事按钮 */
  .new-story-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    width: 100%;
    height: 36px;
    background: var(--brand-muted);
    color: var(--brand);
    border: 1px solid var(--border-brand);
    border-radius: var(--radius-sm);
    font-size: var(--text-sm);
    font-weight: 600;
    transition: background 0.15s, color 0.15s;
  }
  .new-story-btn:hover {
    background: var(--brand-muted-hover);
    color: var(--brand-hover);
  }
  .new-story-btn i { width: 16px; height: 16px; }

  /* 侧边栏导航分隔 */
  .sidebar-divider {
    height: 1px;
    background: var(--border-default);
    margin: var(--space-1) 0;
  }

  /* 导航项 */
  .nav-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 36px;
    padding: 0 var(--space-3);
    background: transparent;
    border: none;
    border-left: 3px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text-tertiary);
    font-size: var(--text-sm);
    text-align: left;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item i { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-item:hover {
    color: var(--text-secondary);
    background: var(--surface-2);
  }
  /* 激活态 */
  .nav-item[data-active="true"] {
    color: var(--brand);
    background: var(--brand-subtle);
    border-left: 3px solid var(--brand);
    font-weight: 600;
  }

  /* === 主内容区 === */
  .main-content {
    height: 100%;
    overflow: hidden;
    background: var(--surface-0);
  }

  /* === 单栏聚焦容器 === */
  .focus-container {
    max-width: var(--content-max-width);
    margin: 0 auto;
    padding: var(--space-8) var(--space-6);
  }
    </style>

    <!-- ============================================================
         页面特有 CSS — 工作台 input 状态
         ============================================================ -->
    <style>
  /* === 工作台双栏布局：主轴 + 热力图侧栏 === */
  .workspace-layout {
    display: flex;
    height: 100%;
    position: relative;
  }

  /* 主轴区 — 可滚动 */
  .workspace-axis {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
  }

  /* === 步骤大卡片 === */
  .step-card {
    background: var(--surface-1);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-xl);
    padding: var(--space-8) var(--space-8);
  }

  /* 步骤标签条 */
  .step-card-header {
    padding-bottom: var(--space-4);
    margin-bottom: var(--space-6);
    border-bottom: 1px solid var(--border-default);
  }
  .step-label {
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    color: var(--text-tertiary);
    letter-spacing: 0.3px;
  }

  /* 说明文字 */
  .step-description {
    font-size: var(--text-base);
    color: var(--text-secondary);
    line-height: 1.75;
    margin-bottom: var(--space-6);
  }

  /* 输入区 */
  .step-input-section {
    margin-bottom: var(--space-6);
  }
  .step-input-label {
    display: block;
    font-size: var(--text-sm);
    color: var(--text-tertiary);
    margin-bottom: var(--space-3);
  }
  .step-input {
    width: 100%;
    min-height: 80px;
    background: var(--surface-2);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    padding: var(--space-3);
    color: var(--text-secondary);
    font-family: var(--font-sans);
    font-size: var(--text-base);
    line-height: 1.6;
    resize: vertical;
    transition: border-color 0.15s, background 0.15s;
  }
  .step-input::placeholder {
    color: var(--text-muted);
  }
  .step-input:focus {
    outline: none;
    border-color: var(--border-brand);
    background: var(--surface-3);
  }

  /* 卡片操作区 — 按钮右对齐 */
  .step-card-actions {
    display: flex;
    justify-content: flex-end;
  }

  /* 主按钮 */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    background: var(--brand);
    color: var(--brand-foreground);
    border: none;
    border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-6);
    font-size: var(--text-base);
    font-weight: 600;
    transition: background 0.15s;
  }
  .btn-primary:hover {
    background: var(--brand-hover);
  }
  .btn-primary i {
    width: 16px;
    height: 16px;
  }

  /* === 步骤进度指示 === */
  .step-progress {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: var(--space-3);
    margin-top: var(--space-8);
  }
  .step-progress-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    transition: all 0.2s;
  }
  .step-progress-dot.completed {
    background: var(--state-success);
  }
  .step-progress-dot.current {
    background: var(--brand);
    box-shadow: 0 0 0 4px var(--brand-muted);
  }
  .step-progress-dot.pending {
    background: var(--surface-4);
  }

  /* === 期待热力图侧栏 === */
  .heatmap-sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--surface-1);
    border-left: 1px solid var(--border-default);
    display: flex;
    flex-direction: column;
    transition: width 0.25s ease, opacity 0.25s ease, border-color 0.25s ease;
  }
  .heatmap-sidebar.collapsed {
    width: 0;
    overflow: hidden;
    opacity: 0;
    border-left-color: transparent;
  }

  .heatmap-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-4) var(--space-4);
    border-bottom: 1px solid var(--border-default);
  }
  .heatmap-title {
    font-family: var(--font-serif);
    font-size: var(--text-base);
    font-weight: 700;
    color: var(--text-primary);
  }
  .heatmap-collapse-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--text-tertiary);
    transition: background 0.15s, color 0.15s;
  }
  .heatmap-collapse-btn:hover {
    background: var(--surface-2);
    color: var(--text-secondary);
  }
  .heatmap-collapse-btn i {
    width: 16px;
    height: 16px;
  }

  .heatmap-body {
    flex: 1;
    padding: var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  /* 热力图条目 */
  .heatmap-item {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-md);
    background: var(--surface-2);
  }
  .heatmap-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .heatmap-item-error .heatmap-dot {
    background: var(--state-error);
    box-shadow: 0 0 0 3px var(--state-error-bg);
  }
  .heatmap-item-warning .heatmap-dot {
    background: var(--state-warning);
    box-shadow: 0 0 0 3px var(--state-warning-bg);
  }
  .heatmap-label {
    font-size: var(--text-sm);
    color: var(--text-secondary);
    flex: 1;
  }
  .heatmap-count {
    font-family: var(--font-mono);
    font-size: var(--text-base);
    font-weight: 700;
  }
  .heatmap-item-error .heatmap-count {
    color: var(--state-error);
  }
  .heatmap-item-warning .heatmap-count {
    color: var(--state-warning);
  }

  /* 热力图底部 */
  .heatmap-footer {
    padding: var(--space-4);
    border-top: 1px solid var(--border-default);
  }
  .heatmap-history-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: var(--text-sm);
    color: var(--text-tertiary);
    transition: color 0.15s;
  }
  .heatmap-history-link:hover {
    color: var(--brand);
  }
  .heatmap-history-link i {
    width: 14px;
    height: 14px;
  }

  /* === 折叠后的展开按钮 === */
  .heatmap-expand-btn {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    display: none;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 48px;
    background: var(--surface-1);
    border: 1px solid var(--border-default);
    border-right: none;
    border-radius: var(--radius-md) 0 0 var(--radius-md);
    color: var(--text-tertiary);
    z-index: 10;
    transition: background 0.15s, color 0.15s;
  }
  .heatmap-expand-btn:hover {
    background: var(--surface-2);
    color: var(--text-secondary);
  }
  .heatmap-expand-btn i {
    width: 16px;
    height: 16px;
  }
  .heatmap-expand-btn.visible {
    display: flex;
  }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">

<!-- ============================================================
     应用外壳
     ============================================================ -->
<div class="app-shell">

  <!-- ===== 顶栏 ===== -->
  <header class="topbar">
    <!-- 左侧：品牌标识 -->
    <div class="brand">
      <div class="brand-mark">墨</div>
      <div class="brand-name">
        <span class="name-main">驯墨</span>
        <span class="name-sub">Tame Ink</span>
      </div>
    </div>

    <!-- 右侧：连接状态 + 历史 -->
    <div class="topbar-right">
      <div class="connection-status">
        <span class="status-dot"></span>
        <span>已连接</span>
      </div>
      <button class="icon-btn" data-dom-id="open-history" aria-label="历史记录">
        <i data-lucide="history"></i>
      </button>
    </div>
  </header>

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <!-- 新建故事按钮 -->
    <button class="new-story-btn" type="button">
      <i data-lucide="plus"></i>
      <span>新建故事</span>
    </button>

    <div class="sidebar-divider"></div>

    <!-- 导航项（工作台设为激活态） -->
    <nav class="nav-list">
      <button class="nav-item" type="button" data-nav-key="workspace" data-active="true">
        <i data-lucide="layout-dashboard"></i>
        <span>工作台</span>
      </button>
      <button class="nav-item" type="button" data-nav-key="library">
        <i data-lucide="book-open"></i>
        <span>故事库</span>
      </button>
      <button class="nav-item" type="button" data-nav-key="settings">
        <i data-lucide="settings"></i>
        <span>设置</span>
      </button>
    </nav>
  </aside>

  <!-- ===== 主内容区 ===== -->
  <main class="main-content">
    <!-- 工作台双栏布局：主轴 + 热力图侧栏 -->
    <div class="workspace-layout">

      <!-- 主轴区 -->
      <div class="workspace-axis">
        <div class="focus-container">

          <!-- 步骤大卡片 -->
          <div class="step-card">
            <!-- 步骤标签条 -->
            <div class="step-card-header">
              <span class="step-label">第 2 步 / 设计读者契约</span>
            </div>

            <!-- 说明文字 -->
            <p class="step-description">
              AI 会根据你的创作简报，起草一份读者契约——<br>
              包括：目标读者、核心体验、主角承诺、必须兑现的爽点。
            </p>

            <!-- 额外要求输入区 -->
            <div class="step-input-section">
              <label class="step-input-label">有什么额外要求？（留空则按简报推断）</label>
              <textarea class="step-input" placeholder="补充你的想法...（可选）"></textarea>
            </div>

            <!-- 操作按钮 -->
            <div class="step-card-actions">
              <button class="btn-primary" type="button">
                <span>让 AI 起草</span>
                <i data-lucide="arrow-right"></i>
              </button>
            </div>
          </div>

          <!-- 步骤进度指示点 -->
          <div class="step-progress">
            <span class="step-progress-dot completed" title="第 1 步 · 创作简报（已完成）"></span>
            <span class="step-progress-dot current" title="第 2 步 · 设计读者契约（进行中）"></span>
            <span class="step-progress-dot pending" title="第 3 步 · 未开始"></span>
            <span class="step-progress-dot pending" title="第 4 步 · 未开始"></span>
            <span class="step-progress-dot pending" title="第 5 步 · 未开始"></span>
            <span class="step-progress-dot pending" title="第 6 步 · 未开始"></span>
          </div>

        </div>
      </div>

      <!-- 右侧期待热力图侧栏 -->
      <aside class="heatmap-sidebar collapsed" id="heatmapSidebar">
        <!-- 标题 + 折叠按钮 -->
        <div class="heatmap-header">
          <span class="heatmap-title">期待热力</span>
          <button class="heatmap-collapse-btn" type="button" onclick="toggleHeatmap()" aria-label="折叠热力图">
            <i data-lucide="chevron-right"></i>
          </button>
        </div>

        <!-- 热力图主体 -->
        <div class="heatmap-body">
          <!-- 悬挂期待 -->
          <div class="heatmap-item heatmap-item-error">
            <span class="heatmap-dot"></span>
            <span class="heatmap-label">悬挂</span>
            <span class="heatmap-count">3</span>
          </div>
          <!-- 进行中 -->
          <div class="heatmap-item heatmap-item-warning">
            <span class="heatmap-dot"></span>
            <span class="heatmap-label">进行中</span>
            <span class="heatmap-count">2</span>
          </div>
        </div>

        <!-- 底部历史链接 -->
        <div class="heatmap-footer">
          <a href="#" class="heatmap-history-link">
            <span>历史</span>
            <i data-lucide="arrow-right"></i>
          </a>
        </div>
      </aside>

      <!-- 折叠后的展开按钮 -->
      <button class="heatmap-expand-btn visible" id="heatmapExpandBtn" type="button" onclick="toggleHeatmap()" aria-label="展开热力图">
        <i data-lucide="chevron-left"></i>
      </button>

    </div>
  </main>

</div>

<!-- 初始化图标 + 热力图折叠逻辑 -->
<script>
  lucide.createIcons();

  // 热力图侧栏折叠/展开
  function toggleHeatmap() {
    var sidebar = document.getElementById('heatmapSidebar');
    var expandBtn = document.getElementById('heatmapExpandBtn');
    sidebar.classList.toggle('collapsed');
    if (sidebar.classList.contains('collapsed')) {
      expandBtn.classList.add('visible');
    } else {
      expandBtn.classList.remove('visible');
    }
  }
</script>
</body>
</html>
