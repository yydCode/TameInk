<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>读者契约 - 驯墨</title>
    <style id="theme-vars">
/* ============================================================
   驯墨 Tame Ink — 品牌设计令牌 · 夜墨主题 v2
   ============================================================
   核心理念：作者只做三件事——说想法、看结果、做取舍
   暗色沉浸主题，单栏聚焦布局
   ============================================================ */

:root {
  /* === 品牌主色 — 墨绿 === */
  --brand: #6aae8d;
  --brand-hover: #5d9a7d;
  --brand-active: #4c8a6a;
  --brand-muted: rgba(106, 174, 141, 0.12);
  --brand-muted-hover: rgba(106, 174, 141, 0.2);
  --brand-subtle: rgba(106, 174, 141, 0.06);
  --brand-foreground: #ffffff;

  /* === 表面色阶 === */
  --surface-0: #0d1117;
  --surface-1: #151c25;
  --surface-2: #1a2332;
  --surface-3: #222f40;
  --surface-4: #2d3d52;

  /* === 文本色阶 === */
  --text-primary: #e6edf3;
  --text-secondary: #a3b8cc;
  --text-tertiary: #7a92ab;
  --text-muted: #546a84;
  --text-on-brand: #ffffff;

  /* === 边框 === */
  --border-default: rgba(148, 163, 184, 0.12);
  --border-strong: rgba(148, 163, 184, 0.22);
  --border-brand: rgba(106, 174, 141, 0.35);

  /* === 状态色 === */
  --state-success: #4ade80;
  --state-success-bg: rgba(74, 222, 128, 0.1);
  --state-warning: #fbbf24;
  --state-warning-bg: rgba(251, 191, 36, 0.1);
  --state-error: #f87171;
  --state-error-bg: rgba(248, 113, 113, 0.1);
  --state-info: #60a5fa;
  --state-info-bg: rgba(96, 165, 250, 0.1);

  /* === 语义别名 === */
  --background: var(--surface-0);
  --foreground: var(--text-primary);
  --color-background: var(--surface-0);
  --color-foreground: var(--text-primary);
  --color-card: var(--surface-2);
  --color-card-foreground: var(--text-primary);
  --color-popover: var(--surface-3);
  --color-popover-foreground: var(--text-primary);
  --color-primary: var(--brand);
  --color-primary-foreground: var(--brand-foreground);
  --color-muted: var(--surface-3);
  --color-muted-foreground: var(--text-secondary);
  --color-border: var(--border-default);
  --color-input: var(--border-default);
  --color-ring: var(--brand);

  /* === 圆角 === */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === 字体 === */
  --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-serif: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  --font-mono: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, monospace;

  /* === 字号 === */
  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 22px;
  --text-3xl: 28px;
  --text-4xl: 36px;

  /* === 间距 === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === 布局 === */
  --sidebar-width: 200px;
  --topbar-height: 48px;
  --content-max-width: 760px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100vh;
  color: var(--text-primary);
  background: var(--surface-0);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-serif); font-weight: 700; line-height: 1.25; }
a { color: var(--brand); text-decoration: none; transition: color 0.15s; }
a:hover { color: var(--brand-hover); }
button { color: inherit; font: inherit; cursor: pointer; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 9999px; }
::selection { background: var(--brand-muted); color: var(--brand-foreground); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--background);
    --color-foreground: var(--foreground);
    --color-card: var(--color-card);
    --color-card-foreground: var(--color-card-foreground);
    --color-popover: var(--color-popover);
    --color-popover-foreground: var(--color-popover-foreground);
    --color-primary: var(--color-primary);
    --color-primary-foreground: var(--color-primary-foreground);
    --color-muted: var(--color-muted);
    --color-muted-foreground: var(--color-muted-foreground);
    --color-border: var(--color-border);
    --color-input: var(--color-input);
    --color-ring: var(--color-ring);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
    --radius-xl: var(--radius-xl);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .text-background { color: var(--background); }
      .border-background { border-color: var(--background); }

      .bg-card-foreground { background-color: var(--color-card-foreground); }
      .text-card-foreground { color: var(--color-card-foreground); }
      .border-card-foreground { border-color: var(--color-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--color-card-foreground); }
      .bg-popover { background-color: var(--color-popover); }
      .text-popover { color: var(--color-popover); }
      .border-popover { border-color: var(--color-popover); }

      .bg-popover-foreground { background-color: var(--color-popover-foreground); }
      .text-popover-foreground { color: var(--color-popover-foreground); }
      .border-popover-foreground { border-color: var(--color-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--color-popover-foreground); }
      .bg-primary { background-color: var(--color-primary); }
      .text-primary { color: var(--color-primary); }
      .border-primary { border-color: var(--color-primary); }
      .ring-primary { --tw-ring-color: var(--color-primary); }
      .bg-primary-foreground { background-color: var(--color-primary-foreground); }
      .text-primary-foreground { color: var(--color-primary-foreground); }
      .border-primary-foreground { border-color: var(--color-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--color-primary-foreground); }
      .bg-muted { background-color: var(--color-muted); }
      .text-muted { color: var(--color-muted); }
      .border-muted { border-color: var(--color-muted); }
      .ring-muted { --tw-ring-color: var(--color-muted); }
      .bg-muted-foreground { background-color: var(--color-muted-foreground); }
      .text-muted-foreground { color: var(--color-muted-foreground); }
      .border-muted-foreground { border-color: var(--color-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--color-muted-foreground); }
      .bg-border { background-color: var(--color-border); }
      .text-border { color: var(--color-border); }
      .border-border { border-color: var(--color-border); }
      .ring-border { --tw-ring-color: var(--color-border); }
      .bg-input { background-color: var(--color-input); }
      .text-input { color: var(--color-input); }
      .border-input { border-color: var(--color-input); }
      .ring-input { --tw-ring-color: var(--color-input); }
      .bg-ring { background-color: var(--color-ring); }
      .text-ring { color: var(--color-ring); }
      .border-ring { border-color: var(--color-ring); }
      .ring-ring { --tw-ring-color: var(--color-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>

    <!-- ===== 外壳样式（来自 project-shell.html） ===== -->
    <style>
      /* === 应用外壳整体布局 === */
      .app-shell {
        display: grid;
        grid-template-rows: var(--topbar-height) 1fr;
        grid-template-columns: var(--sidebar-width) 1fr;
        height: 100vh;
        overflow: hidden;
      }

      /* === 顶栏 === */
      .topbar {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: var(--topbar-height);
        padding: 0 var(--space-5);
        background: var(--surface-1);
        border-bottom: 1px solid var(--border-default);
      }
      .brand { display: flex; align-items: center; gap: var(--space-2); }
      .brand-mark {
        display: flex; align-items: center; justify-content: center;
        width: 24px; height: 24px;
        background: var(--brand); color: var(--brand-foreground);
        border-radius: var(--radius-sm);
        font-family: var(--font-serif); font-size: var(--text-sm);
        font-weight: 700; line-height: 1;
      }
      .brand-name { display: flex; flex-direction: column; line-height: 1.1; }
      .brand-name .name-main {
        font-family: var(--font-serif); font-size: var(--text-base);
        font-weight: 700; color: var(--text-primary);
      }
      .brand-name .name-sub {
        font-size: var(--text-xs); color: var(--text-muted); letter-spacing: 0.5px;
      }
      .topbar-right { display: flex; align-items: center; gap: var(--space-4); }
      .connection-status {
        display: flex; align-items: center; gap: var(--space-2);
        font-size: var(--text-sm); color: var(--text-secondary);
      }
      .status-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--state-success);
        box-shadow: 0 0 0 3px var(--state-success-bg);
      }
      .icon-btn {
        display: inline-flex; align-items: center; justify-content: center;
        width: 32px; height: 32px;
        background: transparent; border: none; border-radius: var(--radius-sm);
        color: var(--text-tertiary);
        transition: background 0.15s, color 0.15s;
      }
      .icon-btn:hover { background: var(--surface-2); color: var(--text-secondary); }
      .icon-btn i { width: 16px; height: 16px; }

      /* === 侧边栏 === */
      .sidebar {
        background: var(--surface-1);
        border-right: 1px solid var(--border-default);
        padding: var(--space-4) var(--space-3);
        display: flex; flex-direction: column; gap: var(--space-2);
        overflow-y: auto;
      }
      .new-story-btn {
        display: flex; align-items: center; justify-content: center; gap: var(--space-2);
        width: 100%; height: 36px;
        background: var(--brand-muted); color: var(--brand);
        border: 1px solid var(--border-brand); border-radius: var(--radius-sm);
        font-size: var(--text-sm); font-weight: 600;
        transition: background 0.15s, color 0.15s;
      }
      .new-story-btn:hover { background: var(--brand-muted-hover); color: var(--brand-hover); }
      .new-story-btn i { width: 16px; height: 16px; }
      .sidebar-divider { height: 1px; background: var(--border-default); margin: var(--space-1) 0; }
      .nav-list { display: flex; flex-direction: column; gap: 8px; }
      .nav-item {
        display: flex; align-items: center; gap: 8px;
        width: 100%; height: 36px; padding: 0 var(--space-3);
        background: transparent; border: none;
        border-left: 3px solid transparent; border-radius: var(--radius-sm);
        color: var(--text-tertiary); font-size: var(--text-sm); text-align: left;
        transition: background 0.15s, color 0.15s;
      }
      .nav-item i { width: 16px; height: 16px; flex-shrink: 0; }
      .nav-item:hover { color: var(--text-secondary); background: var(--surface-2); }
      .nav-item[data-active="true"] {
        color: var(--brand); background: var(--brand-subtle);
        border-left: 3px solid var(--brand); font-weight: 600;
      }

      /* === 主内容区 === */
      .main-content { height: 100%; overflow-y: auto; background: var(--surface-0); }
      .focus-container {
        max-width: var(--content-max-width);
        margin: 0 auto;
        padding: var(--space-8) var(--space-6);
      }
    </style>

    <!-- ===== 读者契约卡片样式 ===== -->
    <style>
      /* 卡片容器 */
      .contract-card {
        background: var(--surface-1);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-xl);
        overflow: hidden;
      }
      /* 标题条 */
      .contract-card__header {
        display: flex;
        align-items: baseline;
        gap: var(--space-2);
        padding: var(--space-4) var(--space-8);
        border-bottom: 1px solid var(--border-default);
      }
      .contract-card__title {
        font-family: var(--font-serif);
        font-size: var(--text-lg);
        font-weight: 700;
        color: var(--text-primary);
      }
      .contract-card__subtitle {
        font-size: var(--text-sm);
        color: var(--text-tertiary);
      }
      /* 内容区 */
      .contract-card__body {
        padding: var(--space-6) var(--space-8);
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }
      /* 字段：默认单行水平排列 */
      .contract-field {
        display: flex;
        align-items: flex-start;
        gap: var(--space-4);
      }
      /* 多行字段：label 在上，value 在下缩进 */
      .contract-field--stacked {
        flex-direction: column;
        gap: var(--space-2);
      }
      .contract-field__label {
        font-size: var(--text-sm);
        color: var(--text-tertiary);
        font-weight: 500;
        width: 80px;
        flex-shrink: 0;
        line-height: 1.6;
      }
      .contract-field--stacked .contract-field__label {
        width: auto;
      }
      .contract-field__value {
        font-size: var(--text-base);
        color: var(--text-primary);
        line-height: 1.6;
        flex: 1;
      }
      /* 禁止方向：错误色文字 */
      .contract-field__value--danger {
        color: var(--state-error);
      }
      /* 编号列表 */
      .contract-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
      .contract-list__item {
        display: flex;
        align-items: flex-start;
        gap: var(--space-2);
      }
      .contract-list__num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: var(--radius-full);
        background: var(--brand-muted);
        color: var(--brand);
        font-size: var(--text-xs);
        font-weight: 600;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .contract-list__text {
        font-size: var(--text-base);
        color: var(--text-primary);
        line-height: 1.6;
      }
      /* 底部按钮区 */
      .contract-card__footer {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-4) var(--space-8);
        border-top: 1px solid var(--border-default);
      }
      /* 通用按钮 */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        height: 36px;
        padding: 0 var(--space-4);
        border-radius: var(--radius-sm);
        font-size: var(--text-sm);
        font-weight: 600;
        border: 1px solid transparent;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
        white-space: nowrap;
      }
      .btn i { width: 16px; height: 16px; }
      /* 主按钮：品牌色背景、白字 */
      .btn--primary {
        background: var(--brand);
        color: var(--brand-foreground);
      }
      .btn--primary:hover { background: var(--brand-hover); }
      /* 次按钮：透明背景、强边框、次级文字 */
      .btn--secondary {
        background: transparent;
        border-color: var(--border-strong);
        color: var(--text-secondary);
      }
      .btn--secondary:hover {
        border-color: var(--text-tertiary);
        color: var(--text-primary);
      }
      /* 文字按钮：三级文字 */
      .btn--ghost {
        background: transparent;
        color: var(--text-tertiary);
        padding: 0 var(--space-2);
      }
      .btn--ghost:hover { color: var(--text-secondary); }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <!-- ===== 应用外壳 ===== -->
    <div class="app-shell">

      <!-- 顶栏 -->
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">墨</div>
          <div class="brand-name">
            <span class="name-main">驯墨</span>
            <span class="name-sub">Tame Ink</span>
          </div>
        </div>
        <div class="topbar-right">
          <div class="connection-status">
            <span class="status-dot"></span>
            <span>已连接</span>
          </div>
          <button class="icon-btn" data-dom-id="open-history" aria-label="历史记录">
            <i data-lucide="history"></i>
          </button>
        </div>
      </header>

      <!-- 侧边栏：工作台激活 -->
      <aside class="sidebar">
        <button class="new-story-btn" type="button">
          <i data-lucide="plus"></i>
          <span>新建故事</span>
        </button>
        <div class="sidebar-divider"></div>
        <nav class="nav-list">
          <button class="nav-item" type="button" data-nav-key="workspace" data-active="true">
            <i data-lucide="layout-dashboard"></i>
            <span>工作台</span>
          </button>
          <button class="nav-item" type="button" data-nav-key="library">
            <i data-lucide="book-open"></i>
            <span>故事库</span>
          </button>
          <button class="nav-item" type="button" data-nav-key="settings">
            <i data-lucide="settings"></i>
            <span>设置</span>
          </button>
        </nav>
      </aside>

      <!-- 主内容区 -->
      <main class="main-content">
        <div class="focus-container">

          <!-- 读者契约卡片 -->
          <section class="contract-card" aria-label="读者契约 AI 提议">

            <!-- 标题条 -->
            <header class="contract-card__header">
              <h1 class="contract-card__title">读者契约</h1>
              <span class="contract-card__subtitle">· AI 提议</span>
            </header>

            <!-- 内容区：字段以定义列表样式展示 -->
            <div class="contract-card__body">

              <!-- 单行字段：平台 -->
              <div class="contract-field">
                <span class="contract-field__label">平台</span>
                <span class="contract-field__value">番茄 · 都市频道</span>
              </div>

              <!-- 单行字段：核心体验 -->
              <div class="contract-field">
                <span class="contract-field__label">核心体验</span>
                <span class="contract-field__value">普通人靠专业能力打脸逆袭</span>
              </div>

              <!-- 单行字段：主角承诺 -->
              <div class="contract-field">
                <span class="contract-field__label">主角承诺</span>
                <span class="contract-field__value">每次压力都要求主角主动做出有代价的选择</span>
              </div>

              <!-- 多行字段：必须兑现（编号列表） -->
              <div class="contract-field contract-field--stacked">
                <span class="contract-field__label">必须兑现</span>
                <ul class="contract-list">
                  <li class="contract-list__item">
                    <span class="contract-list__num">1</span>
                    <span class="contract-list__text">主角能力被关键人物看见</span>
                  </li>
                  <li class="contract-list__item">
                    <span class="contract-list__num">2</span>
                    <span class="contract-list__text">打脸有痛快的即时反馈</span>
                  </li>
                  <li class="contract-list__item">
                    <span class="contract-list__num">3</span>
                    <span class="contract-list__text">每个弧线结尾主角状态有实质提升</span>
                  </li>
                </ul>
              </div>

              <!-- 多行字段：禁止方向（错误色） -->
              <div class="contract-field contract-field--stacked">
                <span class="contract-field__label">禁止方向</span>
                <span class="contract-field__value contract-field__value--danger">
                  无代价的万能成功；主角全程被动
                </span>
              </div>
