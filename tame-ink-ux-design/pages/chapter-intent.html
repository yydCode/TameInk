    <style id="theme-vars">
/* ============================================================
   驯墨 Tame Ink — 品牌设计令牌 · 夜墨主题 v2
   ============================================================
   核心理念：作者只做三件事——说想法、看结果、做取舍
   暗色沉浸主题，单栏聚焦布局
   ============================================================ */

:root {
  /* === 品牌主色 — 墨绿 === */
  --brand: #6aae8d;
  --brand-hover: #5d9a7d;
  --brand-active: #4c8a6a;
  --brand-muted: rgba(106, 174, 141, 0.12);
  --brand-muted-hover: rgba(106, 174, 141, 0.2);
  --brand-subtle: rgba(106, 174, 141, 0.06);
  --brand-foreground: #ffffff;

  /* === 表面色阶 === */
  --surface-0: #0d1117;
  --surface-1: #151c25;
  --surface-2: #1a2332;
  --surface-3: #222f40;
  --surface-4: #2d3d52;

  /* === 文本色阶 === */
  --text-primary: #e6edf3;
  --text-secondary: #a3b8cc;
  --text-tertiary: #7a92ab;
  --text-muted: #546a84;
  --text-on-brand: #ffffff;

  /* === 边框 === */
  --border-default: rgba(148, 163, 184, 0.12);
  --border-strong: rgba(148, 163, 184, 0.22);
  --border-brand: rgba(106, 174, 141, 0.35);

  /* === 状态色 === */
  --state-success: #4ade80;
  --state-success-bg: rgba(74, 222, 128, 0.1);
  --state-warning: #fbbf24;
  --state-warning-bg: rgba(251, 191, 36, 0.1);
  --state-error: #f87171;
  --state-error-bg: rgba(248, 113, 113, 0.1);
  --state-info: #60a5fa;
  --state-info-bg: rgba(96, 165, 250, 0.1);

  /* === 语义别名 === */
  --background: var(--surface-0);
  --foreground: var(--text-primary);
  --color-background: var(--surface-0);
  --color-foreground: var(--text-primary);
  --color-card: var(--surface-2);
  --color-card-foreground: var(--text-primary);
  --color-popover: var(--surface-3);
  --color-popover-foreground: var(--text-primary);
  --color-primary: var(--brand);
  --color-primary-foreground: var(--brand-foreground);
  --color-muted: var(--surface-3);
  --color-muted-foreground: var(--text-secondary);
  --color-border: var(--border-default);
  --color-input: var(--border-default);
  --color-ring: var(--brand);

  /* === 圆角 === */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === 字体 === */
  --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-serif: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  --font-mono: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, monospace;

  /* === 字号 === */
  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 22px;
  --text-3xl: 28px;
  --text-4xl: 36px;

  /* === 间距 === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === 布局 === */
  --sidebar-width: 200px;
  --topbar-height: 48px;
  --content-max-width: 760px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100vh;
  color: var(--text-primary);
  background: var(--surface-0);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-serif); font-weight: 700; line-height: 1.25; }
a { color: var(--brand); text-decoration: none; transition: color 0.15s; }
a:hover { color: var(--brand-hover); }
button { color: inherit; font: inherit; cursor: pointer; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 9999px; }
::selection { background: var(--brand-muted); color: var(--brand-foreground); }

    <!-- ============================================================
         外壳 CSS（来自 partials/project-shell.html）
         ============================================================ -->
    <style id="project-shell">
  /* === 应用外壳整体布局 === */
  .app-shell {
    display: grid;
    grid-template-rows: var(--topbar-height) 1fr;
    grid-template-columns: var(--sidebar-width) 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* === 顶栏 === */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--topbar-height);
    padding: 0 var(--space-5);
    background: var(--surface-1);
    border-bottom: 1px solid var(--border-default);
  }

  /* 品牌标识区 */
  .brand {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .brand-mark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: var(--brand);
    color: var(--brand-foreground);
    border-radius: var(--radius-sm);
    font-family: var(--font-serif);
    font-size: var(--text-sm);
    font-weight: 700;
    line-height: 1;
  }
  .brand-name {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }
  .brand-name .name-main {
    font-family: var(--font-serif);
    font-size: var(--text-base);
    font-weight: 700;
    color: var(--text-primary);
  }
  .brand-name .name-sub {
    font-size: var(--text-xs);
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  /* 顶栏右侧 */
  .topbar-right {
    display: flex;
    align-items: center;
    gap: var(--space-4);
  }
  .connection-status {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: var(--text-sm);
    color: var(--text-secondary);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--state-success);
    box-shadow: 0 0 0 3px var(--state-success-bg);
  }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--text-tertiary);
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover {
    background: var(--surface-2);
    color: var(--text-secondary);
  }
  .icon-btn i { width: 16px; height: 16px; }

  /* === 侧边栏 === */
  .sidebar {
    background: var(--surface-1);
    border-right: 1px solid var(--border-default);
    padding: var(--space-4) var(--space-3);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    overflow-y: auto;
  }

  /* 新建故事按钮 */
  .new-story-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    width: 100%;
    height: 36px;
    background: var(--brand-muted);
    color: var(--brand);
    border: 1px solid var(--border-brand);
    border-radius: var(--radius-sm);
    font-size: var(--text-sm);
    font-weight: 600;
    transition: background 0.15s, color 0.15s;
  }
  .new-story-btn:hover {
    background: var(--brand-muted-hover);
    color: var(--brand-hover);
  }
  .new-story-btn i { width: 16px; height: 16px; }

  /* 侧边栏导航分隔 */
  .sidebar-divider {
    height: 1px;
    background: var(--border-default);
    margin: var(--space-1) 0;
  }

  /* 导航项 */
  .nav-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 36px;
    padding: 0 var(--space-3);
    background: transparent;
    border: none;
    border-left: 3px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text-tertiary);
    font-size: var(--text-sm);
    text-align: left;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item i { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-item:hover {
    color: var(--text-secondary);
    background: var(--surface-2);
  }
  /* 激活态 */
  .nav-item[data-active="true"] {
    color: var(--brand);
    background: var(--brand-subtle);
    border-left: 3px solid var(--brand);
    font-weight: 600;
  }

  /* === 主内容区 === */
  .main-content {
    height: 100%;
    overflow-y: auto;
    background: var(--surface-0);
  }

  /* === 单栏聚焦容器 === */
  .focus-container {
    max-width: var(--content-max-width);
    margin: 0 auto;
    padding: var(--space-8) var(--space-6);
  }
    </style>

    <!-- ============================================================
         页面特有 CSS — 章节意图 AI 预填
         ============================================================ -->
    <style id="page-chapter-intent">
  /* === 章节信息条 === */
  .chapter-info {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: var(--text-sm);
    color: var(--text-tertiary);
    margin-bottom: var(--space-5);
  }
  .chapter-info i {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }

  /* === 意图卡片容器 === */
  .intent-card {
    background: var(--surface-1);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-xl);
    overflow: hidden;
  }

  /* === 标题条 === */
  .intent-card-header {
    padding: var(--space-5) var(--space-6);
    border-bottom: 1px solid var(--border-default);
  }
  .intent-card-header .title {
    font-family: var(--font-serif);
    font-size: var(--text-xl);
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.25;
  }

  /* === 卡片主体 === */
  .intent-card-body {
    padding: var(--space-6);
  }

  /* === 提示文字 === */
  .intent-hint {
    font-size: var(--text-sm);
    color: var(--text-tertiary);
    margin-bottom: var(--space-3);
  }

  /* === 富文本编辑区容器（相对定位，承载 AI 标签） === */
  .intent-editor-wrap {
    position: relative;
  }

  /* === AI 建议小标签（绝对定位左上角） === */
  .ai-badge {
    position: absolute;
    top: var(--space-3);
    left: var(--space-3);
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    padding: 2px var(--space-2);
    background: var(--brand-muted);
    color: var(--brand);
    font-size: var(--text-xs);
    font-weight: 600;
    border-radius: var(--radius-full);
    z-index: 1;
    pointer-events: none;
  }
  .ai-badge i {
    width: 10px;
    height: 10px;
  }

  /* === 可编辑富文本区域 === */
  .intent-editor {
    background: var(--surface-2);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    /* 顶部留出空间给 AI 标签 */
    padding: calc(var(--space-4) + 24px) var(--space-5) var(--space-4);
    min-height: 100px;
    font-size: var(--text-base);
    color: var(--text-primary);
    line-height: 1.75;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .intent-editor:focus {
    border-color: var(--border-brand);
    background: var(--surface-3);
  }

  /* === 底部按钮区 — 居中 === */
  .intent-actions {
    display: flex;
    justify-content: center;
    gap: var(--space-4);
    margin-top: var(--space-6);
  }

  /* === 主按钮：品牌色填充 === */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-3) var(--space-5);
    background: var(--brand);
    color: var(--brand-foreground);
    border: 1px solid var(--brand);
    border-radius: var(--radius-md);
    font-size: var(--text-base);
    font-weight: 600;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-primary:hover {
    background: var(--brand-hover);
    border-color: var(--brand-hover);
  }
  .btn-primary i {
    width: 16px;
    height: 16px;
  }

  /* === 次按钮：透明背景 + border-strong === */
  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-3) var(--space-5);
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    font-size: var(--text-base);
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn-secondary:hover {
    background: var(--surface-2);
    color: var(--text-primary);
    border-color: var(--text-muted);
  }
  .btn-secondary i {
    width: 16px;
    height: 16px;
  }
    </style>
</head>

              <div class="intent-editor" contenteditable="true">主角接手项目，展示专业能力，同时埋下与对手的冲突钩子，章末留下"结果还没出"的期待。</div>
            </div>

            <!-- 底部按钮 — 居中 -->
            <div class="intent-actions">
              <button class="btn-primary" type="button">
                <i data-lucide="check"></i>
                <span>就按这个写</span>
              </button>
              <button class="btn-secondary" type="button">
                <i data-lucide="pencil"></i>
                <span>我要调整</span>
              </button>
            </div>
          </div>

        </article>

      </div>
    </main>
