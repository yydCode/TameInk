<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建作品 - 驯墨</title>
    <style id="theme-vars">
/* ============================================================
   驯墨 Tame Ink — 品牌设计令牌 · 夜墨主题 v2
   ============================================================
   核心理念：作者只做三件事——说想法、看结果、做取舍
   暗色沉浸主题，单栏聚焦布局
   ============================================================ */

:root {
  /* === 品牌主色 — 墨绿 === */
  --brand: #6aae8d;
  --brand-hover: #5d9a7d;
  --brand-active: #4c8a6a;
  --brand-muted: rgba(106, 174, 141, 0.12);
  --brand-muted-hover: rgba(106, 174, 141, 0.2);
  --brand-subtle: rgba(106, 174, 141, 0.06);
  --brand-foreground: #ffffff;

  /* === 表面色阶 === */
  --surface-0: #0d1117;
  --surface-1: #151c25;
  --surface-2: #1a2332;
  --surface-3: #222f40;
  --surface-4: #2d3d52;

  /* === 文本色阶 === */
  --text-primary: #e6edf3;
  --text-secondary: #a3b8cc;
  --text-tertiary: #7a92ab;
  --text-muted: #546a84;
  --text-on-brand: #ffffff;

  /* === 边框 === */
  --border-default: rgba(148, 163, 184, 0.12);
  --border-strong: rgba(148, 163, 184, 0.22);
  --border-brand: rgba(106, 174, 141, 0.35);

  /* === 状态色 === */
  --state-success: #4ade80;
  --state-success-bg: rgba(74, 222, 128, 0.1);
  --state-warning: #fbbf24;
  --state-warning-bg: rgba(251, 191, 36, 0.1);
  --state-error: #f87171;
  --state-error-bg: rgba(248, 113, 113, 0.1);
  --state-info: #60a5fa;
  --state-info-bg: rgba(96, 165, 250, 0.1);

  /* === 语义别名 === */
  --background: var(--surface-0);
  --foreground: var(--text-primary);
  --color-background: var(--surface-0);
  --color-foreground: var(--text-primary);
  --color-card: var(--surface-2);
  --color-card-foreground: var(--text-primary);
  --color-popover: var(--surface-3);
  --color-popover-foreground: var(--text-primary);
  --color-primary: var(--brand);
  --color-primary-foreground: var(--brand-foreground);
  --color-muted: var(--surface-3);
  --color-muted-foreground: var(--text-secondary);
  --color-border: var(--border-default);
  --color-input: var(--border-default);
  --color-ring: var(--brand);

  /* === 圆角 === */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === 字体 === */
  --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-serif: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  --font-mono: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, monospace;

  /* === 字号 === */
  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 22px;
  --text-3xl: 28px;
  --text-4xl: 36px;

  /* === 间距 === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === 布局 === */
  --sidebar-width: 200px;
  --topbar-height: 48px;
  --content-max-width: 760px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100vh;
  color: var(--text-primary);
  background: var(--surface-0);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-serif); font-weight: 700; line-height: 1.25; }
a { color: var(--brand); text-decoration: none; transition: color 0.15s; }
a:hover { color: var(--brand-hover); }
button { color: inherit; font: inherit; cursor: pointer; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 9999px; }
::selection { background: var(--brand-muted); color: var(--brand-foreground); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    <style type="text/tailwindcss">

    --color-card: var(--color-card);

    --color-popover: var(--color-popover);
    --color-popover-foreground: var(--color-popover-foreground);
    --color-primary: var(--color-primary);

  }
    </style>

      .ring-ring { --tw-ring-color: var(--color-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    <!-- ============================================================
         外壳 CSS（来自 project-shell.html）
         ============================================================ -->
    <style>
  /* === 应用外壳整体布局 === */
  .app-shell {
    display: grid;
    grid-template-rows: var(--topbar-height) 1fr;
    grid-template-columns: var(--sidebar-width) 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* === 顶栏 === */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--topbar-height);
    padding: 0 var(--space-5);
    background: var(--surface-1);
    border-bottom: 1px solid var(--border-default);
  }

  /* 品牌标识区 */
  .brand {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .brand-mark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: var(--brand);
    color: var(--brand-foreground);
    border-radius: var(--radius-sm);
    font-family: var(--font-serif);
    font-size: var(--text-sm);
    font-weight: 700;
    line-height: 1;
  }
  .brand-name {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }
  .brand-name .name-main {
    font-family: var(--font-serif);
    font-size: var(--text-base);
    font-weight: 700;
    color: var(--text-primary);
  }
  .brand-name .name-sub {
    font-size: var(--text-xs);
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  /* 顶栏右侧 */
  .topbar-right {
    display: flex;
    align-items: center;
    gap: var(--space-4);
  }
  .connection-status {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: var(--text-sm);
    color: var(--text-secondary);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--state-success);
    box-shadow: 0 0 0 3px var(--state-success-bg);
  }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--text-tertiary);
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover {
    background: var(--surface-2);
    color: var(--text-secondary);
  }
  .icon-btn i { width: 16px; height: 16px; }

  /* === 侧边栏 === */
  .sidebar {
    background: var(--surface-1);
    border-right: 1px solid var(--border-default);
    padding: var(--space-4) var(--space-3);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    overflow-y: auto;
  }

  /* 新建故事按钮 */
  .new-story-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    width: 100%;
    height: 36px;
    background: var(--brand-muted);
    color: var(--brand);
    border: 1px solid var(--border-brand);
    border-radius: var(--radius-sm);
    font-size: var(--text-sm);
    font-weight: 600;
    transition: background 0.15s, color 0.15s;
  }
  .new-story-btn:hover {
    background: var(--brand-muted-hover);
    color: var(--brand-hover);
  }
  .new-story-btn i { width: 16px; height: 16px; }

  /* 侧边栏导航分隔 */
  .sidebar-divider {
    height: 1px;
    background: var(--border-default);
    margin: var(--space-1) 0;
  }

  /* 导航项 */
  .nav-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 36px;
    padding: 0 var(--space-3);
    background: transparent;
    border: none;
    border-left: 3px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text-tertiary);
    font-size: var(--text-sm);
    text-align: left;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item i { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-item:hover {
    color: var(--text-secondary);
    background: var(--surface-2);
  }
  /* 激活态 */
  .nav-item[data-active="true"] {
    color: var(--brand);
    background: var(--brand-subtle);
    border-left: 3px solid var(--brand);
    font-weight: 600;
  }

  /* === 主内容区 === */
  .main-content {
    height: 100%;
    overflow-y: auto;
    background: var(--surface-0);
  }

  /* === 单栏聚焦容器 === */
  .focus-container {
    max-width: var(--content-max-width);
    margin: 0 auto;
    padding: var(--space-8) var(--space-6);
  }
    </style>

    <!-- ============================================================
         页面特有 CSS — 新建项目对话式第一屏
         ============================================================ -->
    <style>
  /* 第一屏：主内容区垂直居中，营造聚焦对话感 */
  .main-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* === 对话式新建卡片 === */
  .np-card {
    position: relative;
    background: var(--surface-1);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-xl);
    overflow: hidden;
  }

  /* 卡片左上角 AI 辅助装饰标签 — 品牌色弱背景 */
  .np-ai-badge {
    position: absolute;
    top: var(--space-3);
    left: var(--space-4);
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    padding: var(--space-1) var(--space-2);
    background: var(--brand-muted);
    color: var(--brand);
    border: 1px solid var(--border-brand);
    border-radius: var(--radius-full);
    font-size: var(--text-xs);
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .np-ai-badge i { width: 12px; height: 12px; }

  /* 标题条 — serif 标题 + 底部分隔线 */
  .np-card-header {
    padding: var(--space-10) var(--space-8) var(--space-4);
    text-align: center;
    border-bottom: 1px solid var(--border-default);
  }
  .np-card-title {
    font-family: var(--font-serif);
    font-size: var(--text-2xl);
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.25;
  }

  /* 卡片主体 */
  .np-card-body {
    padding: var(--space-6) var(--space-8) var(--space-8);
  }

  /* 提示文字 */
  .np-prompt {
    font-size: var(--text-base);
    color: var(--text-secondary);
    margin: var(--space-4) 0;
    line-height: 1.6;
  }

  /* 大文本输入区 — 预填示例文字用 text-tertiary 色，模拟 placeholder 效果 */
  .np-textarea {
    width: 100%;
    min-height: 120px;
    background: var(--surface-2);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    color: var(--text-tertiary);
    font-family: var(--font-sans);
    font-size: var(--text-base);
    line-height: 1.75;
    resize: vertical;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .np-textarea:focus {
    outline: none;
    border-color: var(--border-brand);
    background: var(--surface-3);
    color: var(--text-primary);
  }

  /* 底部提示 */
  .np-hint {
    font-size: var(--text-xs);
    color: var(--text-muted);
    text-align: center;
    margin-top: var(--space-3);
  }

  /* 操作区 — 居中 */
  .np-actions {
    display: flex;
    justify-content: center;
    margin-top: var(--space-6);
  }

  /* 主按钮 — 品牌色背景 + 白字 */
  .np-btn-primary {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    background: var(--brand);
    color: var(--brand-foreground);
    border: none;
    border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-8);
    font-size: var(--text-base);
    font-weight: 600;
    transition: background 0.15s, transform 0.1s;
  }
  .np-btn-primary:hover {
    background: var(--brand-hover);
  }
  .np-btn-primary:active {
    background: var(--brand-active);
  }
  .np-btn-primary i { width: 16px; height: 16px; }
    </style>

<!-- ============================================================
     应用外壳
     ============================================================ -->
<div class="app-shell">

  <!-- ===== 顶栏 ===== -->
  <header class="topbar">
    <!-- 左侧：品牌标识 -->
    <div class="brand">
      <div class="brand-mark">墨</div>
      <div class="brand-name">
        <span class="name-main">驯墨</span>
        <span class="name-sub">Tame Ink</span>
      </div>
    </div>

    <!-- 右侧：连接状态 + 历史 -->
    <div class="topbar-right">
      <div class="connection-status">
        <span class="status-dot"></span>
        <span>已连接</span>
      </div>
      <button class="icon-btn" data-dom-id="open-history" aria-label="历史记录">
        <i data-lucide="history"></i>
      </button>
    </div>
  </header>

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <!-- 新建故事按钮 -->
    <button class="new-story-btn" type="button">
      <i data-lucide="plus"></i>
      <span>新建故事</span>
    </button>

    <div class="sidebar-divider"></div>

    <!-- 导航项（工作台设为激活态） -->
    <nav class="nav-list">
      <button class="nav-item" type="button" data-nav-key="workspace" data-active="true">
        <i data-lucide="layout-dashboard"></i>
        <span>工作台</span>
      </button>
      <button class="nav-item" type="button" data-nav-key="library">
        <i data-lucide="book-open"></i>
        <span>故事库</span>
      </button>
      <button class="nav-item" type="button" data-nav-key="settings">
        <i data-lucide="settings"></i>
        <span>设置</span>
      </button>
    </nav>
  </aside>

  <!-- ===== 主内容区 ===== -->
  <main class="main-content">
    <!-- 单栏聚焦容器 -->
    <div class="focus-container">

      <!-- 对话式新建卡片 -->
      <div class="np-card">
        <!-- 左上角 AI 辅助装饰标签 -->
        <span class="np-ai-badge">
          <i data-lucide="sparkles"></i>
          AI 辅助
        </span>

        <!-- 标题条 -->
        <div class="np-card-header">
          <h2 class="np-card-title">开始一部新作品</h2>
        </div>

        <!-- 主体 -->
        <div class="np-card-body">
          <!-- 提示文字 -->
          <p class="np-prompt">用一两句话描述你想写的故事：</p>

          <!-- 大文本输入区（预填示例文字，模拟 placeholder 效果） -->
          <textarea class="np-textarea">都市重生，主角回到高考前，靠记忆力逆袭，打脸曾经看不起他的人。写在番茄上。</textarea>

          <!-- 底部提示 -->
          <p class="np-hint">最少只需一句话，AI 会帮你补全其余细节。</p>

          <!-- 操作区 -->
          <div class="np-actions">
            <button class="np-btn-primary" type="button">
              <i data-lucide="sparkles"></i>
              <span>AI 帮我搭框架</span>
              <i data-lucide="arrow-right"></i>
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>

</div>

<script>lucide.createIcons();</script>
</body>
