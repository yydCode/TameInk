<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成中 - 驯墨</title>
    <style id="theme-vars">
/* ============================================================
   驯墨 Tame Ink — 品牌设计令牌 · 夜墨主题 v2
   ============================================================
   核心理念：作者只做三件事——说想法、看结果、做取舍
   暗色沉浸主题，单栏聚焦布局
   ============================================================ */

:root {
  /* === 品牌主色 — 墨绿 === */
  --brand: #6aae8d;
  --brand-hover: #5d9a7d;
  --brand-active: #4c8a6a;
  --brand-muted: rgba(106, 174, 141, 0.12);
  --brand-muted-hover: rgba(106, 174, 141, 0.2);
  --brand-subtle: rgba(106, 174, 141, 0.06);
  --brand-foreground: #ffffff;

  /* === 表面色阶 === */
  --surface-0: #0d1117;
  --surface-1: #151c25;
  --surface-2: #1a2332;
  --surface-3: #222f40;
  --surface-4: #2d3d52;

  /* === 文本色阶 === */
  --text-primary: #e6edf3;
  --text-secondary: #a3b8cc;
  --text-tertiary: #7a92ab;
  --text-muted: #546a84;
  --text-on-brand: #ffffff;

  /* === 边框 === */
  --border-default: rgba(148, 163, 184, 0.12);
  --border-strong: rgba(148, 163, 184, 0.22);
  --border-brand: rgba(106, 174, 141, 0.35);

  /* === 状态色 === */
  --state-success: #4ade80;
  --state-success-bg: rgba(74, 222, 128, 0.1);
  --state-warning: #fbbf24;
  --state-warning-bg: rgba(251, 191, 36, 0.1);
  --state-error: #f87171;
  --state-error-bg: rgba(248, 113, 113, 0.1);
  --state-info: #60a5fa;
  --state-info-bg: rgba(96, 165, 250, 0.1);

  /* === 语义别名 === */
  --background: var(--surface-0);
  --foreground: var(--text-primary);
  --color-background: var(--surface-0);
  --color-foreground: var(--text-primary);
  --color-card: var(--surface-2);
  --color-card-foreground: var(--text-primary);
  --color-popover: var(--surface-3);
  --color-popover-foreground: var(--text-primary);
  --color-primary: var(--brand);
  --color-primary-foreground: var(--brand-foreground);
  --color-muted: var(--surface-3);
  --color-muted-foreground: var(--text-secondary);
  --color-border: var(--border-default);
  --color-input: var(--border-default);
  --color-ring: var(--brand);

  /* === 圆角 === */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === 字体 === */
  --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-serif: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  --font-mono: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, monospace;

  /* === 字号 === */
  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 22px;
  --text-3xl: 28px;
  --text-4xl: 36px;

  /* === 间距 === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === 布局 === */
  --sidebar-width: 200px;
  --topbar-height: 48px;
  --content-max-width: 760px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100vh;
  color: var(--text-primary);
  background: var(--surface-0);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-serif); font-weight: 700; line-height: 1.25; }
a { color: var(--brand); text-decoration: none; transition: color 0.15s; }
a:hover { color: var(--brand-hover); }
button { color: inherit; font: inherit; cursor: pointer; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 9999px; }
::selection { background: var(--brand-muted); color: var(--brand-foreground); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--background);
    --color-foreground: var(--foreground);
    --color-card: var(--color-card);
    --color-card-foreground: var(--color-card-foreground);
    --color-popover: var(--color-popover);
    --color-popover-foreground: var(--color-popover-foreground);
    --color-primary: var(--color-primary);
    --color-primary-foreground: var(--color-primary-foreground);
    --color-muted: var(--color-muted);
    --color-muted-foreground: var(--color-muted-foreground);
    --color-border: var(--color-border);
    --color-input: var(--color-input);
    --color-ring: var(--color-ring);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);

  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }

    <!-- ============================================================
         共享项目外壳样式 + 页面专属样式
         ============================================================ -->
    <style>
  /* === 应用外壳整体布局 === */
  .app-shell {
    display: grid;
    grid-template-rows: var(--topbar-height) 1fr;
    grid-template-columns: var(--sidebar-width) 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* === 顶栏 === */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--topbar-height);
    padding: 0 var(--space-5);
    background: var(--surface-1);
    border-bottom: 1px solid var(--border-default);
  }

  /* 品牌标识区 */
  .brand {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .brand-mark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: var(--brand);
    color: var(--brand-foreground);
    border-radius: var(--radius-sm);
    font-family: var(--font-serif);
    font-size: var(--text-sm);
    font-weight: 700;
    line-height: 1;
  }
  .brand-name {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }
  .brand-name .name-main {
    font-family: var(--font-serif);
    font-size: var(--text-base);
    font-weight: 700;
    color: var(--text-primary);
  }
  .brand-name .name-sub {
    font-size: var(--text-xs);
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  /* 顶栏右侧 */
  .topbar-right {
    display: flex;
    align-items: center;
    gap: var(--space-4);
  }
  .connection-status {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: var(--text-sm);
    color: var(--text-secondary);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--state-success);
    box-shadow: 0 0 0 3px var(--state-success-bg);
  }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--text-tertiary);
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover {
    background: var(--surface-2);
    color: var(--text-secondary);
  }
  .icon-btn i { width: 16px; height: 16px; }

  /* === 侧边栏 === */
  .sidebar {
    background: var(--surface-1);
    border-right: 1px solid var(--border-default);
    padding: var(--space-4) var(--space-3);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    overflow-y: auto;
  }

  /* 新建故事按钮 */
  .new-story-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    width: 100%;
    height: 36px;
    background: var(--brand-muted);
    color: var(--brand);
    border: 1px solid var(--border-brand);
    border-radius: var(--radius-sm);
    font-size: var(--text-sm);
    font-weight: 600;
    transition: background 0.15s, color 0.15s;
  }
  .new-story-btn:hover {
    background: var(--brand-muted-hover);
    color: var(--brand-hover);
  }
  .new-story-btn i { width: 16px; height: 16px; }

  /* 侧边栏导航分隔 */
  .sidebar-divider {
    height: 1px;
    background: var(--border-default);
    margin: var(--space-1) 0;
  }

  /* 导航项 */
  .nav-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 36px;
    padding: 0 var(--space-3);
    background: transparent;
    border: none;
    border-left: 3px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text-tertiary);
    font-size: var(--text-sm);
    text-align: left;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item i { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-item:hover {
    color: var(--text-secondary);
    background: var(--surface-2);
  }
  /* 激活态 */
  .nav-item[data-active="true"] {
    color: var(--brand);
    background: var(--brand-subtle);
    border-left: 3px solid var(--brand);
    font-weight: 600;
  }

  /* === 主内容区 === */
  .main-content {
    height: 100%;
    overflow-y: auto;
    background: var(--surface-0);
  }

  /* === 单栏聚焦容器 === */
  .focus-container {
    max-width: var(--content-max-width);
    margin: 0 auto;
    padding: var(--space-8) var(--space-6);
  }

  /* ============================================================
     页面专属：工作台 · 生成中 (workspace-wait)
     ============================================================ */

  /* 栅格：聚焦主栏 + 右侧期待热力图 */
  .workspace-layout {
    max-width: 1080px;
    margin: 0 auto;
    padding: var(--space-10) var(--space-6);
    display: grid;
    grid-template-columns: minmax(0, 760px) 260px;
    gap: var(--space-8);
    justify-content: center;
    align-items: start;
  }
  /* 折叠态：右侧收缩为窄条，主栏重新居中 */
  .workspace-layout[data-heat="collapsed"] {
    grid-template-columns: minmax(0, 760px) auto;
  }
  /* 覆盖 focus-container 自带居中与内边距以适配栅格 */
  .workspace-layout .focus-container {
    max-width: none;
    width: 100%;
    margin: 0;
    padding: 0;
  }

  /* --- 生成进度卡片（与 input 页面卡片容器一致） --- */
  .gen-card {
    background: var(--surface-1);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  /* 标题条 */
  .gen-card__header {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-3) var(--space-5);
    border-bottom: 1px solid var(--border-default);
  }
  .gen-card__title {
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    color: var(--text-tertiary);
    letter-spacing: 0.3px;
  }
  /* 标题条左侧脉冲点 */
  .gen-pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--brand);
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(106,174,141,0.5); }
    70%  { box-shadow: 0 0 0 8px rgba(106,174,141,0); }
    100% { box-shadow: 0 0 0 0 rgba(106,174,141,0); }
  }

  /* 卡片主体（居中） */
  .gen-card__body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-5);
    padding: var(--space-12) var(--space-6) var(--space-8);
    text-align: center;
  }
  /* 旋转图标 */
  .gen-spinner {
    width: 32px;
    height: 32px;
    color: var(--brand);
    animation: spin 1.2s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 说明文字 */
  .gen-hint {
    font-size: var(--text-base);
    color: var(--text-secondary);
    line-height: 1.6;
    max-width: 420px;
  }

  /* 进度条 */
  .progress-block { width: 100%; max-width: 480px; }
  .progress-track {
    width: 100%;
    height: 6px;
    background: var(--surface-3);
    border-radius: var(--radius-full);
    overflow: hidden;
  }
  .progress-fill {
    width: 60%;
    height: 100%;
    border-radius: var(--radius-full);
    background: linear-gradient(90deg, var(--brand) 0%, var(--brand-hover) 50%, var(--brand) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer {
    0%   { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .progress-meta {
    margin-top: var(--space-2);
    font-size: var(--text-xs);
    color: var(--text-tertiary);
    text-align: right;
  }

  /* 底部 */
  .gen-card__footer {
    display: flex;
    justify-content: center;
    padding: var(--space-4) var(--space-6) var(--space-6);
    border-top: 1px solid var(--border-default);
  }
  .text-btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    background: transparent;
    border: none;
    color: var(--text-tertiary);
    font-size: var(--text-sm);
    padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-sm);
    transition: color 0.15s, background 0.15s;
  }
  .text-btn:hover { color: var(--text-secondary); background: var(--surface-2); }
  .text-btn i { width: 14px; height: 14px; }

  /* --- 右侧期待热力图 --- */
  .expectation-panel {
    position: sticky;
    top: var(--space-6);
    background: var(--surface-1);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .exp-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--border-default);
  }
  .exp-title {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-family: var(--font-serif);
    font-size: var(--text-sm);
    font-weight: 700;
    color: var(--text-secondary);
  }
  .exp-title i { width: 14px; height: 14px; color: var(--brand); }
  .exp-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--text-tertiary);
  }
  .exp-toggle:hover { background: var(--surface-2); color: var(--text-secondary); }
  .exp-toggle i { width: 14px; height: 14px; }

  /* 折叠态：仅显示标题条 */
  .expectation-panel[data-collapsed="true"] .exp-body { display: none; }

  .exp-body { padding: var(--space-4); }
  .exp-sub {
    font-size: var(--text-xs);
    color: var(--text-muted);
    margin-bottom: var(--space-3);
  }

  /* 热力网格 */
  .heat-grid {
    display: grid;
    grid-template-columns: 40px repeat(8, 1fr);
    gap: 3px;
    align-items: center;
  }
  .heat-col-head {
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    font-family: var(--font-mono);
  }
  .heat-col-head.is-current { color: var(--brand); font-weight: 700; }
  .heat-row-label {
    font-size: var(--text-xs);
    color: var(--text-tertiary);
    text-align: right;
    padding-right: 4px;
  }
  .heat-cell {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 3px;
    background: var(--surface-3);
    transition: transform 0.12s;
  }
  .heat-cell:hover { transform: scale(1.18); }
  .heat-cell[data-level="1"] { background: var(--brand-subtle); }
  .heat-cell[data-level="2"] { background: var(--brand-muted); }
  .heat-cell[data-level="3"] { background: rgba(106,174,141,0.45); }
  .heat-cell[data-level="4"] { background: var(--brand); }

  /* 图例 */
  .exp-legend {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--space-2);
    margin-top: var(--space-3);
    font-size: 10px;
    color: var(--text-muted);
  }
  .exp-legend .legend-cells { display: flex; gap: 2px; }
  .exp-legend .legend-cells .heat-cell { width: 12px; height: 12px; aspect-ratio: auto; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <div class="app-shell">

    <!-- ===== 顶栏 ===== -->
    <header class="topbar">
      <!-- 左侧：品牌标识 -->
      <div class="brand">
        <div class="brand-mark">墨</div>
        <div class="brand-name">
          <span class="name-main">驯墨</span>
          <span class="name-sub">Tame Ink</span>
        </div>
      </div>
      <!-- 右侧：连接状态 + 历史 -->
      <div class="topbar-right">
        <div class="connection-status">
          <span class="status-dot"></span>
          <span>已连接</span>
        </div>
        <button class="icon-btn" data-dom-id="open-history" aria-label="历史记录">
          <i data-lucide="history"></i>
        </button>
      </div>
    </header>

    <!-- ===== 侧边栏 ===== -->
    <aside class="sidebar">
      <!-- 新建故事按钮 -->
      <button class="new-story-btn" type="button">
        <i data-lucide="plus"></i>
        <span>新建故事</span>
      </button>
      <div class="sidebar-divider"></div>
      <!-- 导航项 -->
      <nav class="nav-list">
        <button class="nav-item" type="button" data-nav-key="workspace" data-active="true">
          <i data-lucide="layout-dashboard"></i>
          <span>工作台</span>
        </button>
        <button class="nav-item" type="button" data-nav-key="library">
          <i data-lucide="book-open"></i>
          <span>故事库</span>
        </button>
        <button class="nav-item" type="button" data-nav-key="settings">
          <i data-lucide="settings"></i>
          <span>设置</span>
        </button>
      </nav>
    </aside>

    <!-- ===== 主内容区 ===== -->
    <main class="main-content">
      <div class="workspace-layout" data-heat="expanded">

        <!-- 聚焦主栏：生成进度卡片 -->
        <div class="focus-container">
          <section class="gen-card" aria-label="生成进度">
            <!-- 标题条 -->
            <div class="gen-card__header">
              <span class="gen-pulse" aria-hidden="true"></span>
              <span class="gen-card__title">正在生成...</span>
            </div>
            <!-- 主体 -->
            <div class="gen-card__body">
              <!-- 旋转动画图标（loader, 32px, 品牌色） -->
              <i class="gen-spinner" data-lucide="loader"></i>
              <!-- 说明文字 -->
              <p class="gen-hint">AI 正在起草读者契约，通常需要 20-60 秒。</p>
              <!-- 进度条 -->
              <div class="progress-block">
                <div class="progress-track">
                  <div class="progress-fill"></div>
                </div>
                <div class="progress-meta">大约还需 15 秒</div>
              </div>
            </div>
            <!-- 底部：取消生成 -->
            <div class="gen-card__footer">
              <button class="text-btn" type="button" data-dom-id="cancel-generation">
                <i data-lucide="x"></i>
                <span>取消生成</span>
              </button>
            </div>
          </section>
        </div>

        <!-- 右侧期待热力图（可折叠） -->
        <aside class="expectation-panel" data-collapsed="false">
          <div class="exp-header">
            <span class="exp-title">
              <i data-lucide="flame"></i>
              <span>期待热力图</span>
            </span>
            <button class="exp-toggle" type="button" data-heat-toggle aria-label="折叠期待热力图">
              <i data-lucide="chevron-up"></i>
            </button>
          </div>
          <div class="exp-body">
            <p class="exp-sub">各章节期待强度</p>
            <div class="heat-grid">
              <!-- 列头：章节编号（第 3 章为当前） -->
              <div></div>
              <div class="heat-col-head">1</div>
              <div class="heat-col-head">2</div>
              <div class="heat-col-head is-current">3</div>
              <div class="heat-col-head">4</div>
              <div class="heat-col-head">5</div>
              <div class="heat-col-head">6</div>
              <div class="heat-col-head">7</div>
              <div class="heat-col-head">8</div>

              <!-- 悬念 -->
              <div class="heat-row-label">悬念</div>
              <div class="heat-cell" data-level="2"></div>
              <div class="heat-cell" data-level="3"></div>
              <div class="heat-cell" data-level="3"></div>
              <div class="heat-cell" data-level="4"></div>
              <div class="heat-cell" data-level="4"></div>
              <div class="heat-cell" data-level="3"></div>
              <div class="heat-cell" data-level="2"></div>
              <div class="heat-cell" data-level="1"></div>

              <!-- 情感 -->
              <div class="heat-row-label">情感</div>
              <div class="heat-cell" data-level="3"></div>
              <div class="heat-cell" data-level="4"></div>
              <div class="heat-cell" data-level="4"></div>
              <div class="heat-cell" data-level="3"></div>
              <div class="heat-cell" data-level="2"></div>
              <div class="heat-cell" data-level="3"></div>
              <div class="heat-cell" data-level="3"></div>
              <div class="heat-cell" data-level="2"></div>

              <!-- 爽点 -->
              <div class="heat-row-label">爽点</div>
              <div class="heat-cell" data-level="1"></div>
              <div class="heat-cell" data-level="1"></div>
              <div class="heat-cell" data-level="2"></div>
              <div class="heat-cell" data-level="3"></div>
              <div class="heat-cell" data-level="4"></div>
              <div class="heat-cell" data-level="4"></div>
              <div class="heat-cell" data-level="3"></div>
              <div class="heat-cell" data-level="2"></div>

              <!-- 伏笔 -->
              <div class="heat-row-label">伏笔</div>
              <div class="heat-cell" data-level="2"></div>
              <div class="heat-cell" data-level="1"></div>
              <div class="heat-cell" data-level="1"></div>
              <div class="heat-cell" data-level="2"></div>
              <div class="heat-cell" data-level="2"></div>
              <div class="heat-cell" data-level="3"></div>
              <div class="heat-cell" data-level="4"></div>
              <div class="heat-cell" data-level="4"></div>
            </div>
            <!-- 图例 -->
            <div class="exp-legend">
              <span>低</span>
              <div class="legend-cells">
                <div class="heat-cell" data-level="1"></div>
                <div class="heat-cell" data-level="2"></div>
                <div class="heat-cell" data-level="3"></div>
                <div class="heat-cell" data-level="4"></div>
              </div>
              <span>高</span>
            </div>
          </div>
        </aside>

      </div>
    </main>

  </div>

  <script>
    // 渲染 lucide 图标
    lucide.createIcons();

    // 期待热力图折叠 / 展开
    document.querySelectorAll('[data-heat-toggle]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var panel = btn.closest('.expectation-panel');
        var layout = document.querySelector('.workspace-layout');
        var isCollapsed = panel.getAttribute('data-collapsed') === 'true';
        // 切换状态
        panel.setAttribute('data-collapsed', isCollapsed ? 'false' : 'true');
        layout.setAttribute('data-heat', isCollapsed ? 'expanded' : 'collapsed');
        // 切换图标：展开态用向上箭头（可折叠），折叠态用向下箭头（可展开）
        btn.querySelector('i').setAttribute('data-lucide', isCollapsed ? 'chevron-up' : 'chevron-down');
        lucide.createIcons();
      });
    });
  </script>
</body>
</html>
