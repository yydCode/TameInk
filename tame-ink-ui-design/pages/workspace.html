/* ============================================================
   驯墨 Tame Ink — 品牌设计令牌 · 夜墨主题
   ============================================================
   面向番茄网文作者的 AI 创作引擎
   暗色主题：降低视觉疲劳，沉浸式创作体验
   ============================================================ */

/* --- 品牌前缀变量 --- */
:root {
  /* === 基础色系 === */
  --ink-deep: #0d1117;
  --ink-900: #131a24;
  --ink-800: #1a2332;
  --ink-700: #222f40;
  --ink-600: #2d3d52;
  --ink-500: #3d5068;
  --ink-400: #546a84;
  --ink-300: #7a92ab;
  --ink-200: #a3b8cc;
  --ink-100: #c8d6e5;
  --ink-50: #e2eaf3;

  /* === 品牌主色 — 墨绿 === */
  --brand: #6aae8d;
  --brand-hover: #5d9a7d;
  --brand-muted: rgba(106, 174, 141, 0.12);
  --brand-muted-hover: rgba(106, 174, 141, 0.2);
  --brand-subtle: rgba(106, 174, 141, 0.06);
  --brand-foreground: #ffffff;

  /* === 表面色阶 === */
  --surface-0: #0d1117;
  --surface-1: #151c25;
  --surface-2: #1a2332;
  --surface-3: #222f40;
  --surface-4: #2d3d52;

  /* === 文本色阶 === */
  --text-primary: #e6edf3;
  --text-secondary: #a3b8cc;
  --text-tertiary: #7a92ab;
  --text-muted: #546a84;
  --text-on-brand: #ffffff;

  /* === 边框 === */
  --border-default: rgba(148, 163, 184, 0.12);
  --border-strong: rgba(148, 163, 184, 0.22);
  --border-brand: rgba(106, 174, 141, 0.35);

  /* === 状态色 === */
  --state-success: #4ade80;
  --state-success-bg: rgba(74, 222, 128, 0.1);
  --state-warning: #fbbf24;
  --state-warning-bg: rgba(251, 191, 36, 0.1);
  --state-error: #f87171;
  --state-error-bg: rgba(248, 113, 113, 0.1);
  --state-info: #60a5fa;
  --state-info-bg: rgba(96, 165, 250, 0.1);

  /* === 语义别名 (fill-html-head.mjs 兼容) === */
  --background: var(--surface-0);
  --foreground: var(--text-primary);
  --color-background: var(--surface-0);
  --color-foreground: var(--text-primary);
  --color-card: var(--surface-2);
  --color-card-foreground: var(--text-primary);
  --color-popover: var(--surface-3);
  --color-popover-foreground: var(--text-primary);
  --color-primary: var(--brand);
  --color-primary-foreground: var(--brand-foreground);
  --color-muted: var(--surface-3);
  --color-muted-foreground: var(--text-secondary);
  --color-border: var(--border-default);
  --color-input: var(--border-default);
  --color-ring: var(--brand);
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* === 圆角 === */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* === 阴影 === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.05);

  /* === 字体 === */
  --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --font-serif: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  --font-mono: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, monospace;

  /* === 字号 === */
  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 22px;
  --text-3xl: 28px;
  --text-4xl: 36px;

  /* === 字重 === */
  --font-regular: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* === 行高 === */
  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.75;
  --leading-loose: 2;

  /* === 间距 === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === 布局 === */
  --sidebar-width: 220px;
  --topbar-height: 52px;
  --content-max-width: 1200px;
}

/* === 基础重置 === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root {
  min-height: 100vh;
  color: var(--text-primary);
  background: var(--surface-0);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* === 标题字体 === */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-serif);
  font-weight: var(--font-bold);
  color: var(--text-primary);
  line-height: var(--leading-tight);
}

/* === 链接和按钮 === */
a { color: var(--brand); text-decoration: none; transition: color 0.15s; }
a:hover { color: var(--brand-hover); }
button { color: inherit; font: inherit; cursor: pointer; }

/* === 滚动条 === */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: var(--radius-full); }
::-webkit-scrollbar-thumb:hover { background: var(--ink-400); }

/* === 选择 === */
::selection { background: var(--brand-muted); color: var(--brand-foreground); }

.topbar {

  gap: var(--space-4);

  align-items: center;
  gap: var(--space-2);

}

}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}

.brand-name {
  font-size: var(--text-base);
  font-weight: var(--font-semibold);
  color: var(--text-primary);
}

.brand-subtitle {
  font-size: var(--text-xs);
  color: var(--text-tertiary);
  font-weight: var(--font-regular);
}

/* 项目选择器 */
.project-selector {
  position: relative;
}

.project-selector-btn {
