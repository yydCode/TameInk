[project]
name = "tame-ink-backend"
version = "0.1.0"
description = "Local API for Tame Ink"
requires-python = ">=3.12"
dependencies = [
    "dulwich>=0.22,<0.23",
    "fastapi>=0.115,<0.116",
    "pyyaml>=6,<7",
    "uvicorn>=0.34,<0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
