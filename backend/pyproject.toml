[project]
name = "tame-ink-backend"
version = "0.1.0"
description = "Local API for Tame Ink"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.4,<4",
    "deepagents>=0.6,<0.7",
    "dulwich>=0.22,<0.23",
    "fastapi>=0.115,<0.116",
    "filelock>=3.16,<4",
    "huey>=3.2,<4",
    "keyring>=25,<26",
    "langchain-openai>=1.3,<2",
    "peewee>=3.18,<4",
    "pyyaml>=6,<7",
    "uvicorn>=0.34,<0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["performance: explicit large-project performance verification"]
addopts = "-m 'not performance'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
